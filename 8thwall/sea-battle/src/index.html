<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <title>Морской бой — перископный автомат</title>
  <meta name="description" content="Советский автомат «Морской бой» в дополненной реальности: корабли идут по морю, бей их торпедами с упреждением.">

  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" async="true" data-preload-chunks="slam"></script>
</head>

<body>
<script src="bundle.js"></script>

<!-- HUD: кассовый узел автомата — счётчики пусков и поражений -->
<div class="hud">
  <div class="hud-top">
    <span id="torpsLabel" class="counter">ТОРПЕДЫ 10</span>
    <span id="hitsLabel" class="counter">ПОРАЖЕНО 0</span>
    <button id="resetBtn" type="button" class="btn">ЗАНОВО</button>
  </div>

  <!-- Лампа «ТОРПЕДИРОВАНО» на панели автомата -->
  <div id="torpedoed" class="torpedoed hidden">ТОРПЕДИРОВАНО</div>

  <div id="hint" class="hint hidden">
    Корабли идут — бей <b>с упреждением</b>. Тап по морю = пуск
  </div>
  <div id="promptText" class="prompt">ТАПНИ ПО ПОЛУ ПЕРЕД СОБОЙ — РАЗВЕРНУТЬ ФЛОТ</div>

  <!-- Призовая игра: 10 попаданий из 10 -->
  <div id="prizeFlash" class="prize hidden">
    <div class="prize-star">&#9733;</div>
    ПРИЗОВАЯ ИГРА &mdash; ЕЩЁ 3 ТОРПЕДЫ
  </div>

  <div id="gameOver" class="gameover hidden">
    <div class="gameover-title">ИГРА ОКОНЧЕНА</div>
    <div class="gameover-sub" id="overSub"></div>
    <div class="gameover-cta">15 копеек &mdash; новая игра</div>
  </div>
</div>

<a-scene
  sea-battle
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true; antialias: true"
  xrweb="scale: absolute; allowedDevices: any;">

  <a-camera id="camera" position="0 1.6 3"></a-camera>

  <a-light type="ambient" intensity="0.75"></a-light>
  <a-entity
    light="type: directional; intensity: 1.0; castShadow: true; shadowMapHeight: 1024; shadowMapWidth: 1024; target: #camera"
    xrextras-attach="target: camera; offset: 5 9 2"
    shadow>
  </a-entity>

  <a-box
    id="ground"
    scale="1000 2 1000"
    position="0 -1 0"
    material="shader: shadow; transparent: true; opacity: 0.25"
    shadow>
  </a-box>
</a-scene>

</body>

</html>
