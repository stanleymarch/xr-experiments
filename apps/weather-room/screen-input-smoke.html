<!doctype html><html><body style="margin:0"><div id="scene-container"></div><output id="result">running</output><script type="module">
import { World, PerspectiveCamera, Vector3, VisibilityState } from '@iwsdk/core';
import projectOptions from 'virtual:iwsdk-project';
import { ScreenInputSystem } from './src/weather/systems/screen-input.ts';
import { weatherStore } from './src/weather/weather-state.ts';
import { PanelSystem } from './src/weather/systems/panel.ts';
import { TimelineSystem } from './src/weather/systems/timeline.ts';
import { BrowserPanelSystem } from './src/weather/systems/browser-panel.ts';
try {
  const world = await World.create(document.getElementById('scene-container'), projectOptions);
  world.registerSystem(ScreenInputSystem, {priority: -3.9});
  const system = world.getSystem(ScreenInputSystem);
  const panel = world.getSceneObject('weather-panel');
  const button = panel.requireElementById('forward-button');
  button.addEventListener('click', () => weatherStore.setPlayhead(weatherStore.state.peek().playheadHours + 6));
  for (let i=0; i<60; i++) await new Promise(requestAnimationFrame);
  panel.updateWorldMatrix(true, true);
  const target = button.getWorldPosition(new Vector3());
  const camera = new PerspectiveCamera();
  camera.position.set(0, 1.6, 0);
  camera.lookAt(target);
  camera.updateMatrixWorld(true);
  const referenceSpace = new EventTarget();
  world.renderer.xr.getReferenceSpace = () => referenceSpace;
  const session = new EventTarget();
  session.inputSources = [];
  session.enabledFeatures = [];
  session.visibilityState = 'visible';
  world.renderer.xr.getSession = () => session;
  world.renderer.xr.dispatchEvent({type:'sessionstart'});
  const dispatchSelect = (type, detail) => {
    const action = new Event(type);
    Object.defineProperties(action, {inputSource:{value:detail.inputSource},frame:{value:detail.frame}});
    session.dispatchEvent(action);
  };
  const source = { targetRayMode:'screen', targetRaySpace:{}, handedness:'none' };
  const event = { inputSource: source, timeStamp: performance.now(), frame: { getPose: () => ({transform:{matrix:camera.matrixWorld.elements}}) } };
  const tracked = {...event, inputSource:{...source, targetRayMode:'tracked-pointer'}};
  dispatchSelect('selectstart', tracked);
  dispatchSelect('selectend', tracked);
  if (weatherStore.state.peek().playheadHours !== 0) throw new Error('Tracked controllers must not be handled twice');
  dispatchSelect('selectstart', event);
  dispatchSelect('selectend', {...event, frame:{getPose:()=>null}});
  if (weatherStore.state.peek().playheadHours !== 6) throw new Error('Unhanded XR screen ray did not click the real UIKit button');
  if (system.ray.pointer.getButtonsDown().size !== 0) throw new Error('Selectend without a pose left pointer pressed');
  world.registerSystem(TimelineSystem, {priority:36});
  world.registerSystem(PanelSystem, {priority:37});
  const panelSystem = world.getSystem(PanelSystem);
  const timelineSystem = world.getSystem(TimelineSystem);
  for (let i=0; i<60 && timelineSystem.queries.handles.entities.size===0; i++) await new Promise(requestAnimationFrame);
  const { Grabbed, OneHandGrabbable } = await import('@iwsdk/core');
  const handleEntity = [...timelineSystem.queries.handles.entities].find(entity => entity.hasComponent(OneHandGrabbable));
  const knob = handleEntity.object3D;
  handleEntity.addComponent(Grabbed, {});
  timelineSystem.update();
  knob.position.x = 0.01;
  timelineSystem.update();
  if (weatherStore.state.peek().playheadHours !== 0) throw new Error('Release inside the snap zone did not go live');
  knob.position.x = 0.3;
  timelineSystem.update();
  const scrubbed = weatherStore.state.peek().playheadHours;
  if (Math.abs(scrubbed - 0.3 / 0.45 * 24) > 0.01) throw new Error(`Grabbed knob X did not scrub the playhead (got ${scrubbed})`);
  handleEntity.removeComponent(Grabbed);
  timelineSystem.update();
  if (Math.abs(knob.position.x - 0.3) > 0.0001 || Math.abs(knob.position.y) > 0.0001) throw new Error('Released knob did not re-seat on the rail at the scrubbed hour');
  {
    const { roomModel } = await import('./src/weather/room.ts');
    const { Mesh, PlaneGeometry, MeshBasicMaterial, Vector3 } = await import('@iwsdk/core');
    const floor = new Mesh(new PlaneGeometry(3, 3, 40, 40), new MeshBasicMaterial());
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 1.0, 0);
    floor.updateWorldMatrix(true, true);
    roomModel.beginRebuild([floor]);
    if (!roomModel.hasSurfaces) throw new Error('Tracked floor did not mark room surfaces as available');
    let steps = 0;
    while (roomModel.building && steps < 500) { roomModel.step(); steps += 1; }
    if (roomModel.building) throw new Error('Incremental grid build never finished');
    const sampled = roomModel.surfaceHeightAt(0.5, -0.5, 1.2);
    if (sampled === null || Math.abs(sampled - 1.0) > 0.001) throw new Error(`Sampled floor height is wrong (got ${sampled})`);
    const ceilingSide = roomModel.surfaceHeightAt(0.5, -0.5, 0.9);
    if (ceilingSide !== null) throw new Error('Surface above the query point must not be reported');
    // Real XR planes can have only four boundary vertices. Their center
    // must still intercept precipitation; vertex-only sampling misses it.
    const sparse = new Mesh(new PlaneGeometry(3, 3), new MeshBasicMaterial());
    sparse.rotation.x = -Math.PI / 2;
    sparse.position.set(0, 0.7, 0);
    sparse.updateWorldMatrix(true, true);
    roomModel.beginRebuild([sparse], new Vector3(0, 1.6, 0));
    while (roomModel.building) roomModel.step();
    for (const [x, z] of [[0.125, 0.125], [-0.625, 0.375], [0.875, -0.875]]) {
      const y = roomModel.surfaceHeightAt(x, z, 1.8);
      if (y == null || Math.abs(y - 0.7) > 0.001) throw new Error(`Sparse surface interior missed at ${x},${z}: ${y}`);
    }
    if (roomModel.max.y <= 1.6) throw new Error('Floor-only detection left rain source below the viewer');
    const dense = new Mesh(new PlaneGeometry(4, 4, 300, 300), new MeshBasicMaterial());
    dense.rotation.x = -Math.PI / 2;
    dense.position.set(0, 0.5, 0);
    dense.updateWorldMatrix(true, true);
    roomModel.beginRebuild([dense]);
    const vertices = dense.geometry.getAttribute('position').array.length;
    roomModel.step();
    if (vertices > 20000 && !roomModel.building) throw new Error('Dense mesh build was not sliced across frames');
    while (roomModel.building) roomModel.step();
    roomModel.beginRebuild([]);
    if (roomModel.hasSurfaces) throw new Error('Clearing tracked surfaces must drop room knowledge');
    const ceilingOnly = new Mesh(new PlaneGeometry(3, 3, 8, 8), new MeshBasicMaterial());
    ceilingOnly.rotation.x = Math.PI / 2;
    ceilingOnly.position.set(0, 2.0, 0);
    ceilingOnly.updateWorldMatrix(true, true);
    roomModel.beginRebuild([ceilingOnly]);
    while (roomModel.building) roomModel.step();
    if (roomModel.hasSurfaces) throw new Error('Downward-only geometry must fall back to the default volume');
    const huge = new Mesh(new PlaneGeometry(60, 60, 8, 8), new MeshBasicMaterial());
    huge.rotation.x = -Math.PI / 2;
    huge.updateWorldMatrix(true, true);
    roomModel.beginRebuild([huge]);
    const spanX = roomModel.max.x - roomModel.min.x;
    const spanZ = roomModel.max.z - roomModel.min.z;
    const spanY = roomModel.max.y - roomModel.min.y;
    if (spanX > 8.01 || spanZ > 8.01 || spanY > 4.01) throw new Error(`Room volume span not capped (${spanX.toFixed(2)}x${spanY.toFixed(2)}x${spanZ.toFixed(2)})`);
    while (roomModel.building) roomModel.step();
    // Viewer anchoring: a room mesh reported far from the head (+12 m, beyond
    // the 8 m span cap) is useless as local surface knowledge — the volume
    // falls back head-centered instead of stranding weather out of sight.
    const farFloor = new Mesh(new PlaneGeometry(3, 3, 8, 8), new MeshBasicMaterial());
    farFloor.rotation.x = -Math.PI / 2;
    farFloor.position.set(12, 0, 0);
    farFloor.updateWorldMatrix(true, true);
    roomModel.beginRebuild([farFloor], new Vector3(0, 1.6, 0));
    while (roomModel.building) roomModel.step();
    if (roomModel.hasSurfaces) throw new Error('Far mesh beyond the span cap must fall back, not claim surfaces');
    if (!roomModel.contains(new Vector3(0, 1.6, 0))) throw new Error('Fallback volume does not contain the viewer head');
    // Near-but-offset mesh (inside the span cap): the volume grows to cover
    // both the sensed floor and the head, keeping the mapped surface.
    const nearFloor = new Mesh(new PlaneGeometry(3, 3, 8, 8), new MeshBasicMaterial());
    nearFloor.rotation.x = -Math.PI / 2;
    nearFloor.position.set(4, 0, 0);
    nearFloor.updateWorldMatrix(true, true);
    roomModel.beginRebuild([nearFloor], new Vector3(0, 1.6, 0));
    while (roomModel.building) roomModel.step();
    if (!roomModel.hasSurfaces) throw new Error('Near offset mesh must still mark surfaces');
    if (!roomModel.contains(new Vector3(0, 1.6, 0))) throw new Error('Anchored volume does not contain the viewer head');
    const anchoredSpanX = roomModel.max.x - roomModel.min.x;
    const anchoredSpanY = roomModel.max.y - roomModel.min.y;
    const anchoredSpanZ = roomModel.max.z - roomModel.min.z;
    if (anchoredSpanX > 8.01 || anchoredSpanZ > 8.01 || anchoredSpanY > 4.01) throw new Error(`Anchored volume inflated past the cap (${anchoredSpanX.toFixed(2)}x${anchoredSpanY.toFixed(2)}x${anchoredSpanZ.toFixed(2)})`);
    const farCeiling = new Mesh(new PlaneGeometry(3, 3, 8, 8), new MeshBasicMaterial());
    farCeiling.rotation.x = Math.PI / 2;
    farCeiling.position.set(12, 2.0, 0);
    farCeiling.updateWorldMatrix(true, true);
    roomModel.beginRebuild([farCeiling], new Vector3(0, 1.6, 0));
    while (roomModel.building) roomModel.step();
    if (roomModel.hasSurfaces) throw new Error('Downward-only geometry must fall back even with an anchor');
    if (!roomModel.contains(new Vector3(0, 1.6, 0))) throw new Error('Fallback volume does not contain the viewer head');
    roomModel.beginRebuild([]);
  }
  {
    // Hit-test probe path (no planes/meshes): the sampler owns a head-centred
    // probe volume, measured points flip hasSurfaces, mesh knowledge refuses
    // probes and ends probe ownership, and standing down restores the box.
    const { roomModel: probeRoom, } = await import('./src/weather/room.ts');
    const { Vector3: V3b } = await import('@iwsdk/core');
    const head = new V3b(0, 1.6, 0);
    probeRoom.beginRebuild([]);
    if (!probeRoom.beginProbeVolume(head)) throw new Error('Probe volume refused with no mesh knowledge');
    if (probeRoom.hasSurfaces) throw new Error('Empty probe volume must not claim surfaces');
    if (!probeRoom.contains(head)) throw new Error('Probe volume does not contain the viewer head');
    const probeSpanX = probeRoom.max.x - probeRoom.min.x;
    const probeSpanY = probeRoom.max.y - probeRoom.min.y;
    const probeSpanZ = probeRoom.max.z - probeRoom.min.z;
    if (probeSpanX > 8.01 || probeSpanZ > 8.01 || probeSpanY > 4.01) throw new Error(`Probe volume past the cap (${probeSpanX.toFixed(2)}x${probeSpanY.toFixed(2)}x${probeSpanZ.toFixed(2)})`);
    // Unmeasured points never count: an in-volume NaN cell keeps hasSurfaces false.
    if (probeRoom.surfaceHeightAt(head.x, head.z, 2.5) !== null) throw new Error('Empty probe grid must return null');
    // First measured point maps its cell and flips hasSurfaces (floor at y=0).
    probeRoom.recordProbePoint(head.x, 0, head.z);
    if (!probeRoom.hasSurfaces) throw new Error('Measured probe point did not mark surfaces');
    const probed = probeRoom.surfaceHeightAt(head.x, head.z, 2.5);
    if (probed === null || Math.abs(probed - 0) > 0.26) throw new Error(`Probed floor height is wrong (got ${probed})`);
    if (probeRoom.surfaceHeightAt(head.x, head.z, -0.1) !== null) throw new Error('Probe surface above the query point must not be reported');
    // A contained head keeps sampled cells (no re-anchor wipe mid-tick).
    if (!probeRoom.beginProbeVolume(head)) throw new Error('Contained re-anchor must keep the probe volume');
    if (!probeRoom.hasSurfaces) throw new Error('Contained re-anchor dropped measured probe knowledge');
    // Mesh knowledge refuses probes: the sampler must yield, never fight it.
    const { Mesh: PMesh, PlaneGeometry: PGeo, MeshBasicMaterial: PMat } = await import('@iwsdk/core');
    const sensed = new PMesh(new PGeo(3, 3, 8, 8), new PMat());
    sensed.rotation.x = -Math.PI / 2;
    sensed.updateWorldMatrix(true, true);
    probeRoom.beginRebuild([sensed], head);
    while (probeRoom.building) probeRoom.step();
    if (!probeRoom.hasSurfaces) throw new Error('Sensed floor setup failed before the probe-refusal check');
    if (probeRoom.beginProbeVolume(head)) throw new Error('Probe volume must refuse while mesh knowledge owns the model');
    probeRoom.endProbing();
    if (!probeRoom.hasSurfaces) throw new Error('endProbing must not clear mesh knowledge it never owned');
    // No-capability path: standing down restores exactly today's fallback box.
    probeRoom.beginRebuild([]);
    if (!probeRoom.beginProbeVolume(head)) throw new Error('Probe re-engage failed');
    probeRoom.recordProbePoint(head.x, 0, head.z);
    probeRoom.endProbing();
    if (probeRoom.hasSurfaces) throw new Error('endProbing must restore the no-surface fallback');
    if (probeRoom.surfaceHeightAt(head.x, head.z, 2.5) !== null) throw new Error('Fallback box must report no surface heights');
    probeRoom.beginRebuild([]);
  }
  world.visibilityState.value = VisibilityState.Visible;
  panelSystem.update(0.016, 10);
  timelineSystem.update();
  const initial = panel.position.clone();
  world.player.head.position.x = 0.4;
  world.visibilityState.value = VisibilityState.VisibleBlurred;
  world.visibilityState.value = VisibilityState.Visible;
  panelSystem.update(0.016, 11);
  timelineSystem.update();
  if (panel.position.distanceTo(initial) > 0.0001) throw new Error('Focus transition moved room-fixed panel');
  const rail = [...world.getSystem(TimelineSystem).queries.handles.entities][0].object3D.parent;
  if (Math.abs(rail.position.x) > 0.0001) throw new Error('Focus transition moved room-fixed timeline');
  world.visibilityState.value = VisibilityState.NonImmersive;
  world.visibilityState.value = VisibilityState.Visible;
  panelSystem.update(0.016, 12);
  timelineSystem.update();
  if (Math.abs(panel.position.x - 0.4) > 0.0001 || Math.abs(rail.position.x - 0.4) > 0.0001) throw new Error('New session did not recenter controls');
  world.registerSystem(BrowserPanelSystem, {priority:38});
  const browserRoot = document.getElementById('weather-browser-panel');
  world.renderer.xr.isPresenting = true;
  world.renderer.xr.dispatchEvent({type:'sessionstart'});
  if (!browserRoot.hidden) throw new Error('DOM controls remained visible during XR');
  world.renderer.xr.isPresenting = false;
  world.renderer.xr.getSession = () => null;
  world.renderer.xr.dispatchEvent({type:'sessionend'});
  if (browserRoot.hidden) throw new Error('DOM controls did not return before the next frame after XR end');
  if (Math.abs(world.camera.position.x - 2.8) > 0.001 || Math.abs(world.camera.position.z - 3.5) > 0.001) throw new Error('Manifest browser framing was ignored');
  document.getElementById('result').textContent=JSON.stringify({ok:true, playheadHours:6, released:true, fixedThroughFocus:true, recenteredNewSession:true, browserControlsAfterXREnd:!browserRoot.hidden, target:target.toArray(), browserCamera:world.camera.position.toArray(), scope:'synthetic XR poses and lifecycle; real IWSDK pointer + UIKit + weather store, not physical Android'});
} catch(error) { document.getElementById('result').textContent=JSON.stringify({ok:false,error:String(error),stack:error.stack}); }
</script></body></html>
