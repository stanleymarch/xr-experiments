<script type="module">
// CITY//ORBIT — свежая реализация по официальному пути XR Blocks.
//
// ИДЕЯ: город вокруг тебя — голограммой. Геопозиция → один запрос Overpass API
// (OSM, без ключа) берёт здания в радиусе 400 м → каждый полигон сжимается в
// ориентированный прямоугольник → весь район становится ОДНИМ объектом:
// один InstancedMesh (unlit, аддитив), который можно перенести, повернуть за
// кольцо и увеличить вторым источником — от макета на столе до улиц вокруг
// тебя. Света в сцене нет: голограмма самосветится градиентом по высоте,
// кромками граней и fresnel'ом, а сетка-земля, глифы на крышах и скан-полоса
// во время манипуляции держат образ «данных», а не «застройки».
// Нет сети, нет разрешений, нет данных — детерминированный синтетический
// квартал (DEMO), так что опыт остаётся полным в любом окружении.
//
// Откуда взято (не выдумано):
//   02_object_interaction — object.xb.manipulation, роли handle, хуки объекта;
//   03_spatial_placement  — постановка по ретикулу (placeOnSurface) с
//     проекцией самого ретикула на depth-меш;
//   01_spatial_ui         — UIOverlay как view-space HUD (без своего follow).
//
// Инлайненные device-контракты (причины — в XR-BLOCKS.md корня; дословно из
// проверенного пилота):
//   glowBlending — premultiplied-alpha телефонного AR: аддитив копит альфу
//     канваса, и композитор гасит камеру под «свечением»;
//   installXrGuards — телефонный Chrome отклоняет сессию с required
//     depth-sensing/hand-tracking/local-floor; повторный запрос без них;
//   isPassthrough/hideInPassthrough — 'alpha-blend' = телефон: рисованная
//     плита под городом в AR прячется (её нельзя путать с реальным полом),
//     а свечение колец остаётся — аддитив в premultiplied корректен.

import * as THREE from 'three';
import * as xb from 'xrblocks';

const PARAMS = new URLSearchParams(window.location.search);
const AUTOMATION = PARAMS.has('xrAutomation');
const DEBUG = PARAMS.has('debug');

// --- контракты --------------------------------------------------------------

function glowBlending(material) {
  material.blending = THREE.CustomBlending;
  material.blendSrc = THREE.SrcAlphaFactor;
  material.blendDst = THREE.OneFactor;
  material.blendSrcAlpha = THREE.ZeroFactor;
  material.blendDstAlpha = THREE.OneFactor;
  return material;
}

// Телефонный AR-passthrough: Quest отдаёт 'additive', телефоны 'alpha-blend'.
function isPassthrough() {
  const session = xb.core?.renderer?.xr?.getSession?.();
  return Boolean(session) && session.environmentBlendMode === 'alpha-blend';
}

function hideInPassthrough(objects) {
  const xr = xb.core?.renderer?.xr;
  if (!xr) return;
  const sync = () => {
    const ar = isPassthrough();
    for (const object of objects) if (object) object.visible = !ar;
  };
  xr.addEventListener('sessionstart', sync);
  xr.addEventListener('sessionend', sync);
}

function installXrGuards() {
  const xr = navigator.xr;
  if (!xr || xr.__downgradeGuard) return;
  xr.__downgradeGuard = true;
  const orig = xr.requestSession.bind(xr);
  xr.requestSession = (mode, init) =>
    orig(mode, init).catch((err) => {
      const required = (init && init.requiredFeatures) || [];
      const heavy = required.filter(
        (f) => f === 'depth-sensing' || f === 'hand-tracking' || f === 'local-floor'
      );
      if (!heavy.length) throw err;
      init.requiredFeatures = required.filter((f) => !heavy.includes(f));
      return orig(mode, init);
    });
}

// Класс .in-session на #XRButtonWrapper (кнопка стала END XR) + подсказки
// внутрь официального entry-экрана. Wrapper появляется внутри xb.init().
function watchXrButton(hints = []) {
  const sync = (w) => {
    const btn = w.querySelector('button');
    if (btn) w.classList.toggle('in-session', /end/i.test(btn.textContent));
  };
  const attach = () => {
    const w = document.getElementById('XRButtonWrapper');
    if (!w) return false;
    if (hints.length && !w.querySelector('.app-hints')) {
      const list = document.createElement('ul');
      list.className = 'app-hints';
      for (const hint of hints) {
        const item = document.createElement('li');
        item.textContent = hint;
        list.append(item);
      }
      w.append(list);
    }
    sync(w);
    new MutationObserver(() => sync(w)).observe(w, {
      childList: true, characterData: true, subtree: true,
    });
    return true;
  };
  if (attach()) return;
  const io = new MutationObserver(() => { if (attach()) io.disconnect(); });
  io.observe(document.body, { childList: true, subtree: false });
}

// --- числа и детерминизм ----------------------------------------------------

// Детерминированный ПСЧ: синтетический квартал обязан быть одинаковым в каждом
// прогоне (в т.ч. в автоматизации) — иначе прогон нечем сравнивать.
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// --- OSM: геопозиция, запрос, полигоны --------------------------------------

const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';
const OVERPASS_TIMEOUT = 14000;      // мс: после этого — DEMO, без ожидания вечно
const RADIUS = 400;                  // м — что считаем «своим районом»
const MAX_RECORDS = 1600;            // потолок инстансов: один draw call, но не больше
const DEFAULT_SITE = {lat: 59.9343, lon: 30.3351};

const M_PER_DEG_LAT = 110574;
const mPerDegLon = (lat) => 111320 * Math.cos((lat * Math.PI) / 180);

// Просим геометрию сразу (`out geom`): без второго раунда за узлами. Лимит —
// 800 элементов: центр города в 400 м легко даёт больше, дальше уже не читаемо.
function overpassQuery(lat, lon) {
  return '[out:json][timeout:25];\n(\n' +
    `  way["building"](around:${RADIUS},${lat},${lon});\n` +
    `  relation["building"](around:${RADIUS},${lat},${lon});\n` +
    ');\n' +
    'out geom qt 800;';
}

async function fetchOverpass(lat, lon, signal) {
  const r = await fetch(OVERPASS_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'},
    body: 'data=' + encodeURIComponent(overpassQuery(lat, lon)),
    signal,
  });
  if (!r.ok) throw new Error(`overpass ${r.status}`);
  return r.json();
}

// Плоская местная система: x — восток, z — юг (север = −z, «вперёд» в three).
// На 400 м кривизна Земли не важнее ширины улицы, поэтому проекция линейная.
function project(lat, lon, site) {
  return {
    x: (lon - site.lon) * mPerDegLon(site.lat),
    z: -(lat - site.lat) * M_PER_DEG_LAT,
  };
}

// Ориентированный прямоугольник полигона: самое длинное ребро задаёт ось, вдоль
// неё и поперёк берутся габариты. Форма плана теряется (Г-образный дом станет
// прямоугольником), но город читается кварталами — и всё это один instanced
// draw call вместо тысячи экструзий.
function obbFromPoints(points) {
  let longest = 0, angle = 0;
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const q = points[(i + 1) % points.length];
    const dx = q.x - p.x, dz = q.z - p.z;
    const len = Math.hypot(dx, dz);
    if (len > longest) { longest = len; angle = Math.atan2(dz, dx); }
  }
  const c = Math.cos(angle), s = Math.sin(angle);
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const p of points) {
    const lx = p.x * c + p.z * s;
    const lz = -p.x * s + p.z * c;
    if (lx < minX) minX = lx;
    if (lx > maxX) maxX = lx;
    if (lz < minZ) minZ = lz;
    if (lz > maxZ) maxZ = lz;
  }
  const lcx = (minX + maxX) / 2, lcz = (minZ + maxZ) / 2;
  return {
    cx: lcx * c - lcz * s,
    cz: lcx * s + lcz * c,
    w: maxX - minX,
    d: maxZ - minZ,
    rot: -angle,      // rotation.y в three крутит +X к −Z
    area: (maxX - minX) * (maxZ - minZ),
  };
}

function rectPoints(cx, cz, w, d, rot) {
  const c = Math.cos(rot), s = Math.sin(rot);
  return [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]]
    .map(([lx, lz]) => ({x: cx + lx * c - lz * s, z: cz + lx * s + lz * c}));
}

// Высота: тег height → building:levels → фолбэк. Фолбэк детерминирован по
// индексу, чтобы один и тот же район выглядел одинаково между прогонами.
function heightFromTags(tags, fallback) {
  const h = parseFloat(String(tags?.height ?? '').replace(',', '.'));
  if (Number.isFinite(h) && h >= 2 && h <= 700) return h;
  const levels = parseFloat(String(tags?.['building:levels'] ?? '').replace(',', '.'));
  if (Number.isFinite(levels) && levels >= 1 && levels <= 200) return levels * 3.2 + 1;
  return fallback;
}

const fallbackHeight = (i) =>
  8 + (((Math.imul(i + 1, 2654435761) >>> 8) % 1000) / 1000) * 22;

function buildingFromRing(ring, tags, site, index) {
  if (!Array.isArray(ring) || ring.length < 4) return null;
  const pts = [];
  for (const p of ring) {
    if (!Number.isFinite(p?.lat) || !Number.isFinite(p?.lon)) return null;
    pts.push(project(p.lat, p.lon, site));
  }
  // OSM-кольцо замкнуто повтором первой точки — для габаритов он лишний.
  const last = pts[pts.length - 1];
  if (Math.hypot(last.x - pts[0].x, last.z - pts[0].z) < 0.01) pts.pop();
  if (pts.length < 3) return null;
  const obb = obbFromPoints(pts);
  if (obb.area < 16) return null;                        // будки, гаражи, навесы
  if (Math.hypot(obb.cx, obb.cz) > RADIUS * 1.3) return null;
  return {...obb, h: heightFromTags(tags, fallbackHeight(index)), index};
}

function recordsFromOverpass(json, site) {
  const out = [];
  const els = Array.isArray(json?.elements) ? json.elements : [];
  for (const el of els) {
    const rings = [];
    if (el.type === 'way' && Array.isArray(el.geometry)) {
      rings.push(el.geometry);
    } else if (el.type === 'relation' && Array.isArray(el.members)) {
      // У мультиполигона берём только внешние контуры: внутренние дворы
      // вырезать нечем, а лишний прямоугольник во дворе читается хуже пропуска.
      for (const m of el.members) {
        if (m.role === 'inner' || !Array.isArray(m.geometry)) continue;
        rings.push(m.geometry);
      }
    }
    for (const ring of rings) {
      const rec = buildingFromRing(ring, el.tags, site, out.length);
      if (rec) out.push(rec);
      if (out.length >= MAX_RECORDS) return out;
    }
  }
  return out;
}

// --- синтетический квартал --------------------------------------------------

// Сетка как в живом центре: кварталы 62 м, улицы 15 м, высоты растут к центру
// («даунтаун»), редкая башня. Это не «заглушка», а полноценный демо-город —
// он же нужен офлайну, он же используется в автоматизации.
function demoQuarter(seed = 20260925) {
  const rnd = mulberry32(seed);
  const out = [];
  const CELL = 62, ROAD = 15, BLOCK = CELL - ROAD, HALF = 5;
  for (let gx = -HALF; gx <= HALF; gx++) {
    for (let gz = -HALF; gz <= HALF; gz++) {
      const bx = gx * CELL, bz = gz * CELL;
      const dist = Math.hypot(bx, bz);
      if (dist > RADIUS - BLOCK * 0.5) continue;
      const cols = rnd() < 0.5 ? 2 : 3;
      const rows = rnd() < 0.5 ? 2 : 3;
      const cw = BLOCK / cols, ch = BLOCK / rows;
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          if (rnd() < 0.28) continue;                    // дворы и проходы
          const w = cw * (0.62 + rnd() * 0.3);
          const d = ch * (0.62 + rnd() * 0.3);
          const cx = bx - BLOCK / 2 + cw * (i + 0.5) + (rnd() - 0.5) * 3;
          const cz = bz - BLOCK / 2 + ch * (j + 0.5) + (rnd() - 0.5) * 3;
          const t = 1 - Math.min(1, dist / RADIUS);
          const tower = rnd() < 0.04 ? 1.8 : 1;
          const h = (9 + 42 * Math.pow(t, 2.1) + rnd() * 11) * tower;
          const obb = obbFromPoints(rectPoints(cx, cz, w, d, 0));
          out.push({...obb, h: Math.round(h * 10) / 10, index: out.length});
        }
      }
    }
  }
  return out;
}

// --- POI: второй, лёгкий запрос ---------------------------------------------

// POI-слой отвечает на «что вокруг меня»: те же 400 м, но только именованные
// точки — кафе, аптеки, метро, магазины, достопримечательности.
const POI_KEYS = ['amenity', 'shop', 'tourism', 'leisure', 'railway'];
const POI_LIMIT = 30;                 // ближайших: больше на макете не различить
const POI_TIMEOUT = 9000;             // мс: слой необязательный, город ждать не должен
const POI_LABELS = 9;                 // столько подписей держим одновременно
const POI_CARD_OFFSET = new THREE.Vector3(0.24, 0.12, 0);
const ROSE = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

// Тип POI → человеческое имя и цвет маркера: обстановка на радаре, а не каталог.
const POI_KINDS = {
  cafe: ['кафе', 0xffc46b], restaurant: ['еда', 0xffc46b], fast_food: ['еда', 0xffc46b],
  bar: ['бар', 0xff9e6b], pub: ['бар', 0xff9e6b],
  pharmacy: ['аптека', 0x7ef0b0], hospital: ['больница', 0x7ef0b0], clinic: ['клиника', 0x7ef0b0],
  subway: ['метро', 0x8f7bff], station: ['вокзал', 0x8f7bff], tram_stop: ['трамвай', 0x8f7bff],
  supermarket: ['магазин', 0x6fe3ff], convenience: ['магазин', 0x6fe3ff], bakery: ['пекарня', 0x6fe3ff],
  museum: ['музей', 0xff8fd1], attraction: ['место', 0xff8fd1], hotel: ['отель', 0xff8fd1],
  park: ['парк', 0x9fe8a0], garden: ['сад', 0x9fe8a0],
};
const poiKind = (kind) => POI_KINDS[kind] || [String(kind || 'точка'), 0xc9f4ff];

function overpassPoiQuery(lat, lon) {
  const parts = POI_KEYS.map((k) => `  node["${k}"](around:${RADIUS},${lat},${lon});`).join('\n');
  return `[out:json][timeout:20];\n(\n${parts}\n);\nout body 240;`;
}

async function fetchPois(lat, lon, signal) {
  const r = await fetch(OVERPASS_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'},
    body: 'data=' + encodeURIComponent(overpassPoiQuery(lat, lon)),
    signal,
  });
  if (!r.ok) throw new Error(`overpass ${r.status}`);
  return r.json();
}

// Узлы → ближайшие именованные точки. Безымянная точка ничего не говорит,
// поэтому она отбрасывается: подпись — половина смысла слоя.
function parsePois(json, site) {
  const out = [];
  for (const el of json?.elements || []) {
    const tags = el.tags;
    if (el.type !== 'node' || !tags || !tags.name) continue;
    const kind = POI_KEYS.map((key) => tags[key]).find(Boolean);
    const p = project(el.lat, el.lon, site);
    const d = Math.hypot(p.x, p.z);
    if (d > RADIUS * 1.05) continue;
    out.push({name: tags.name, kind, cx: p.x, cz: p.z, d});
  }
  out.sort((a, b) => a.d - b.d);
  return out.slice(0, POI_LIMIT);
}

// Синтетические POI для демо и автоматизации: берём вершины того же
// детерминированного квартала, поэтому офлайн-опыт остаётся полным, а прогон —
// сравнимым между запусками.
const DEMO_POIS = [
  ['кафе «Орбита»', 'cafe'], ['аптека', 'pharmacy'], ['метро «Центральная»', 'subway'],
  ['магазин у дома', 'convenience'], ['музей города', 'museum'], ['парк у реки', 'park'],
  ['пекарня', 'bakery'], ['отель «Север»', 'hotel'], ['бар «Штиль»', 'bar'],
  ['клиника', 'clinic'], ['трамвай', 'tram_stop'], ['ресторан', 'restaurant'],
  ['сквер', 'garden'], ['вокзал', 'station'],
];
function demoPois(records) {
  const out = [];
  const step = Math.max(1, Math.floor(records.length / DEMO_POIS.length));
  for (let i = 0, n = 0; i < records.length && n < DEMO_POIS.length; i += step, n++) {
    const b = records[i];
    const [name, kind] = DEMO_POIS[n % DEMO_POIS.length];
    out.push({name, kind, cx: b.cx, cz: b.cz, d: Math.hypot(b.cx, b.cz)});
  }
  out.sort((a, b) => a.d - b.d);
  return out;
}

// Азимут от центра города (центр = геопозиция пользователя) в румбах.
function poiAzimuth(p) {
  const deg = (Math.atan2(p.cx, -p.cz) * 180) / Math.PI;
  return {deg: (deg + 360) % 360, rose: ROSE[Math.round(((deg + 360) % 360) / 45) % 8]};
}

// --- геометрия опыта --------------------------------------------------------

const BASE_SCALE = 0.0018;        // 400 м радиуса → 72 см: город-макет на столе
const SCALE_MIN = 0.0006;         // ×0.33 — модель в кулаке
const SCALE_MAX = 0.25;           // ×139 — 100 м радиуса: кварталы вокруг тебя
const ORBIT_R = 430;              // кольцо вращения, м города
const PAD_IN = 470, PAD_OUT = 620;// полоса переноса, м города
// Голограмма города: unlit и аддитив — glowBlending держит premultiplied-
// контракт телефона (см. шапку файла). Цвет — градиент по высоте от бирюзы к
// светлому голубому; объём дают кромка грани и fresnel, а не свет; скан-полоса
// бежит по высоте, пока город держат в руках.
function makeCityMaterial() {
  return glowBlending(new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      uLow: {value: new THREE.Color(0x54d6ff)},
      uHigh: {value: new THREE.Color(0x9fe8ff)},
      uOpacity: {value: 0.62},
      uMaxHeight: {value: 80},
      uScan: {value: 0},
      uScanOn: {value: 0},
    },
    vertexShader: /* glsl */`
      uniform float uMaxHeight;
      varying float vHeight;
      varying vec3 vNormalW;
      varying vec3 vWorld;
      varying vec2 vUvF;
      void main() {
        vUvF = uv;
        vec4 local = vec4(position, 1.0);
        vec3 nrm = normal;
        #ifdef USE_INSTANCING
          local = instanceMatrix * local;
          nrm = mat3(instanceMatrix) * nrm;
        #endif
        vHeight = local.y;                       // высота над землёй города, м
        vNormalW = normalize(mat3(modelMatrix) * nrm);
        vec4 world = modelMatrix * local;
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uLow;
      uniform vec3 uHigh;
      uniform float uOpacity;
      uniform float uMaxHeight;
      uniform float uScan;
      uniform float uScanOn;
      varying float vHeight;
      varying vec3 vNormalW;
      varying vec3 vWorld;
      varying vec2 vUvF;
      void main() {
        float k = clamp(vHeight / uMaxHeight, 0.0, 1.0);
        vec3 tint = mix(uLow, uHigh, pow(k, 0.8));
        // Этажная линия каждые 14 м: дом читается домом, а не кубом.
        float f = fract(vHeight / 14.0);
        float floorLine = 1.0 - smoothstep(0.0, 0.05, min(f, 1.0 - f));
        // Кромка грани (по UV) и fresnel: светлый контур вместо освещения.
        vec2 e = min(vUvF, 1.0 - vUvF);
        float rim = 1.0 - smoothstep(0.0, 0.05, min(e.x, e.y));
        vec3 view = normalize(cameraPosition - vWorld);
        float fres = pow(1.0 - abs(dot(normalize(vNormalW), view)), 2.5);
        // Скан во время манипуляции: лента, бегущая по высоте города.
        float band = 0.0;
        if (uScanOn > 0.001) {
          band = exp(-pow((vHeight - uScan * uMaxHeight) / 20.0, 2.0)) * uScanOn;
        }
        vec3 col = tint * (0.7 + 0.5 * floorLine + 0.45 * rim) + vec3(0.85, 0.95, 1.0) * band;
        float alpha = uOpacity * (0.4 + 0.6 * k) + 0.28 * rim + 0.22 * fres +
                      0.3 * floorLine + 0.75 * band;
        gl_FragColor = vec4(col, clamp(alpha, 0.0, 1.0));
      }`,
  }));
}

// Земля-сетка под городом: тонкая шейдерная сетка на диске, мягкая кромка и
// отметка границы района. Аддитив, поэтому в AR она честно читается как
// голограмма, а не как нарисованный пол (в alpha-blend её всё равно прячем).
function makeGridMaterial(radius) {
  return glowBlending(new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    uniforms: {
      uColor: {value: new THREE.Color(0x54d6ff)},
      uRadius: {value: radius},
      uGlow: {value: 1},
    },
    vertexShader: /* glsl */`
      varying vec2 vXZ;
      void main() {
        vXZ = position.xz;                       // геометрия уже уложена в XZ
        gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uColor;
      uniform float uRadius;
      uniform float uGlow;
      varying vec2 vXZ;
      float gridLine(vec2 p, float cell, float width) {
        vec2 g = abs(fract(p / cell) - 0.5);
        return 1.0 - smoothstep(0.0, width, min(g.x, g.y) * cell);
      }
      void main() {
        float r = length(vXZ);
        // Крупная квартальная сетка по всей подложке, мелкая — только у центра:
        // дальше она всё равно не разрешается и даёт рябь.
        float g = gridLine(vXZ, 100.0, 1.6) +
                  gridLine(vXZ, 25.0, 1.0) * 0.35 * (1.0 - smoothstep(70.0, 260.0, r));
        float fade = 1.0 - smoothstep(uRadius * 0.45, uRadius, r);
        float ring = exp(-pow((r - ${RADIUS}.0) / 8.0, 2.0));
        float alpha = (0.08 + 0.8 * g + 0.6 * ring) * fade * uGlow;
        gl_FragColor = vec4(uColor * (0.6 + 0.7 * g + 0.5 * ring), clamp(alpha, 0.0, 1.0));
      }`,
  }));
}

// Мягкая точка для глифов на крышах: без файлов, как и всё остальное здесь.
function glowSprite() {
  const S = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const grad = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(190,240,255,0.7)');
  grad.addColorStop(1, 'rgba(120,200,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Оттенки кварталов: цвет здания = градиент по высоте (шейдер) × этот множитель,
// поэтому соседние клетки читаются разными районами, а не одной заливкой.
const C = {
  low: new THREE.Color(0x9dc0da),
  high: new THREE.Color(0xffffff),
  orbit: new THREE.Color(0x6fe3ff),
  pad: new THREE.Color(0x8f7bff),
  marker: new THREE.Color(0xffc46b),
};

const HINT = {
  loading: 'запрос зданий в радиусе 400 м…',
  ready: 'тянуть — перенос · кольцо — вращение · удержание на полосе — поставить на поверхность',
  grounding: 'ставлю на поверхность под ретикулом…',
  noSurface: 'поверхностей нет — город на виртуальном полу, наведи ретикул на стол и повтори',
};

class CityOrbit extends xb.Script {
  init() {
    this.site = {...DEFAULT_SITE};
    this.mode = 'demo';              // 'live' — OSM, 'demo' — синтетика
    this.reason = 'синтетический квартал';
    this.status = 'ГОТОВЛЮ ГОРОД';
    this.records = [];
    this.ready = false;
    this.inSession = false;
    this.placeAt = null;
    this.hMin = 0;
    this.hMax = 0;
    this.hot = {orbit: 0, pad: 0, body: 0};
    this.hotTarget = {orbit: 0, pad: 0, body: 0};
    this.t = 0;
    this._fp = 0;
    this.abort = null;
    this.abortTimer = 0;
    this._dummy = new THREE.Object3D();
    this._color = new THREE.Color();
    this._p = new THREE.Vector3();
    this._d = new THREE.Vector3();
    this._pos = new THREE.Vector3();
    this._quat = new THREE.Quaternion();
    this.scanT = 0;                  // фаза скан-полосы
    this.scanOn = false;             // идёт ли манипуляция
    this.scanK = 0;                  // плавное включение скана
    this.pois = [];                  // слой POI (может быть пустым)
    this.poiIndex = -1;              // выбранный маркер
    this.labels = [];                // плавающие подписи ближайших POI
    this.poiMarkers = null;
    this.yawTarget = null;           // плавный доворот «центровать»

    // Голограмма самосветится: свет в сцене не нужен, все её слои аддитивны.

    // Город — ОДИН объект со всей манипуляцией. Оба основных действия
    // (перенос и вращение) без handle неразрешимы: ManipulationManager требует
    // ровно одно основное действие, поэтому перенос задан handle-ролью тела, а
    // вращение — ролью кольца; масштаб приходит вторым источником.
    this.cityRoot = new THREE.Group();
    this.cityRoot.name = 'city';
    this.cityRoot.scale.setScalar(BASE_SCALE);
    this.cityRoot.xb = {
      manipulation: {
        actions: {
          translate: {faceCamera: false},
          rotate: {axis: 'y', space: 'world'},
          scale: {minScale: SCALE_MIN, maxScale: SCALE_MAX},
        },
        handle: {action: xb.ManipulationAction.Translate},
      },
    };
    this.plate = this.buildPlate();
    this.orbitRing = this.buildOrbitRing();
    this.marker = this.buildMarker();
    this.north = this.buildNorth();
    this.radar = this.buildRadar();
    this.cityRoot.add(this.plate, this.orbitRing, this.marker, this.north, this.radar);

    // Маркеры POI живут в масштабе города (это часть макета), подписи и
    // карточка — в мире: текст не должен уменьшаться вместе с макетом.
    this.poiGroup = new THREE.Group();
    this.poiGroup.name = 'city-pois';
    this.cityRoot.add(this.poiGroup);
    this.buildPoiCard();

    // Полоса переноса — отдельная ветка сцены: манипуляция перехватывает
    // длинный выбор, поэтому удержание работает только вне тела города.
    this.padGroup = new THREE.Group();
    this.padGroup.name = 'relocate-pad';
    this.padGroup.add(this.buildPad());

    this.model = new THREE.Group();
    this.model.name = 'city-model';
    this.model.visible = false;      // до данных показывать нечего
    this.model.add(this.cityRoot, this.padGroup);
    this.add(this.model);

    // Аддитивная сетка-земля в телефоне (alpha-blend) копит альфу канваса и
    // гасит камеру под собой — большую и слабую по яркости подложку прячем,
    // сам город и кольца остаются: они светятся и читаются как голограмма.
    hideInPassthrough([this.plate]);

    this.buildHud();
    this.start();
  }

  // --- части города ---------------------------------------------------------

  buildPlate() {
    // Сетка-земля во всю площадь района (до внутреннего края полосы переноса):
    // у неё мягкая кромка, поэтому город не висит в пустоте резким диском.
    const geo = new THREE.CircleGeometry(PAD_IN, 96).rotateX(-Math.PI / 2);
    this.plateMat = makeGridMaterial(PAD_IN);
    const plate = new THREE.Mesh(geo, this.plateMat);
    plate.name = 'city-grid';
    plate.position.y = -0.4;         // чуть ниже подошвы домов
    return plate;
  }

  // Кольцо вокруг города — ручка вращения: взял за него, крутишь весь город.
  buildOrbitRing() {
    const geo = new THREE.TorusGeometry(ORBIT_R, 9, 10, 96).rotateX(-Math.PI / 2);
    this.orbitMat = glowBlending(new THREE.MeshBasicMaterial({
      color: C.orbit, transparent: true, opacity: 0.5, depthWrite: false,
    }));
    const ring = new THREE.Mesh(geo, this.orbitMat);
    ring.name = 'city-orbit-ring';
    ring.position.y = 4;
    ring.xb = {manipulationHandle: {action: xb.ManipulationAction.Rotate}};
    return ring;
  }

  // Полоса переноса. Имена с 'helper' — не косметика: официальный поиск
  // поверхности пропускает по имени вспомогательную геометрию, иначе наша же
  // полоса перекрывала бы постановку города.
  buildPad() {
    const group = new THREE.Group();
    this.padBandMat = glowBlending(new THREE.MeshBasicMaterial({
      color: C.pad, transparent: true, opacity: 0.2, depthWrite: false,
      side: THREE.DoubleSide,
    }));
    const band = new THREE.Mesh(
      new THREE.RingGeometry(PAD_IN, PAD_OUT, 96, 1).rotateX(-Math.PI / 2),
      this.padBandMat
    );
    band.name = 'relocate-band-helper';
    band.position.y = 0.3;
    this.padRimMat = glowBlending(new THREE.MeshBasicMaterial({
      color: C.marker, transparent: true, opacity: 0.4, depthWrite: false,
    }));
    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(PAD_OUT - 8, 5, 8, 96).rotateX(-Math.PI / 2),
      this.padRimMat
    );
    rim.name = 'relocate-rim-helper';
    rim.position.y = 2.2;
    this.padBand = band;
    this.padRim = rim;
    group.add(band, rim);
    return group;
  }

  // «Ты здесь»: центр города — точка пользователя.
  buildMarker() {
    this.markerMat = glowBlending(new THREE.MeshBasicMaterial({
      color: C.marker, transparent: true, opacity: 0.85, depthWrite: false,
    }));
    const group = new THREE.Group();
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 70, 8), this.markerMat);
    mast.position.y = 35;
    const head = new THREE.Mesh(new THREE.SphereGeometry(12, 16, 12), this.markerMat);
    head.position.y = 76;
    const halo = new THREE.Mesh(
      new THREE.RingGeometry(22, 30, 32).rotateX(-Math.PI / 2),
      this.markerMat
    );
    halo.position.y = 1.5;
    group.add(mast, head, halo);
    group.name = 'you-are-here';
    return group;
  }

  // Север: конус у края плиты, острие — на −z (север карты).
  buildNorth() {
    this.northMat = glowBlending(new THREE.MeshBasicMaterial({
      color: C.marker, transparent: true, opacity: 0.55, depthWrite: false,
    }));
    const cone = new THREE.Mesh(new THREE.ConeGeometry(16, 46, 12), this.northMat);
    cone.rotation.x = -Math.PI / 2;
    cone.position.set(0, 24, -(RADIUS + 34));
    cone.name = 'north';
    return cone;
  }

  // Радарное кольцо квартала: тонкий аддитивный кант с бегущей дугой —
  // «свой район как обстановка на экране».
  buildRadar() {
    const geo = new THREE.RingGeometry(RADIUS - 5, RADIUS + 5, 160, 1).rotateX(-Math.PI / 2);
    this.radarMat = glowBlending(new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      uniforms: {uColor: {value: new THREE.Color(0x7fe1ff)}, uPhase: {value: 0}},
      vertexShader: /* glsl */`
        varying vec2 vXZ;
        void main() {
          vXZ = position.xz;
          gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: /* glsl */`
        uniform vec3 uColor;
        uniform float uPhase;
        varying vec2 vXZ;
        void main() {
          float ang = atan(vXZ.y, vXZ.x);
          float d = abs(atan(sin(ang - uPhase), cos(ang - uPhase)));  // ближайшая дуга
          float arc = exp(-pow(d / 0.35, 2.0));
          gl_FragColor = vec4(uColor * (0.7 + 1.3 * arc), 0.14 + 0.9 * arc);
        }`,
    }));
    const ring = new THREE.Mesh(geo, this.radarMat);
    ring.name = 'city-radar';
    ring.position.y = 1.5;
    return ring;
  }

  // Карточка POI: одна на всех, всплывает у маркера и закрывается повторным тапом.
  buildPoiCard() {
    try {
      this.poiUi = {
        name: new xb.UIText({text: '', style: {fontSize: 16, fontWeight: 'bold', color: '#eaf8ff'}}),
        info: new xb.UIText({text: '', style: {fontSize: 12, color: '#9fe8ff', opacity: 0.9}}),
      };
      this.poiUi.center = new xb.UIButton({
        label: 'ЦЕНТРОВАТЬ', icon: 'my_location',
        onClick: () => this.centerOnPoi(),
      });
      this.poiCard = new xb.UICard({
        size: {width: 0.34, height: 'auto'},
        visible: false,
        children: [this.poiUi.name, this.poiUi.info, this.poiUi.center],
      });
      this.poiCard.add(new xb.FaceCamera({mode: 'spherical'}));
      this.add(this.poiCard);
    } catch (e) {
      // Без карточки POI остаются маркерами: слой необязательный.
      this.poiCard = null;
      this.poiUi = null;
    }
  }

  // --- HUD: нативный UIOverlay (view-space) ---------------------------------

  buildHud() {
    this.ui = {
      mode: new xb.UIText({
        text: 'CITY//ORBIT',
        style: {fontSize: 14, color: '#9fb2d2', textAlign: 'center', lineHeight: 1.4},
      }),
      stat: new xb.UIText({
        text: ' ',
        style: {fontSize: 13, color: '#cfe0ff', opacity: 0.9, textAlign: 'center', lineHeight: 1.4},
      }),
      poi: new xb.UIText({
        text: ' ',
        style: {fontSize: 13, color: '#7fe1ff', opacity: 0.95, textAlign: 'center', lineHeight: 1.4},
      }),
      hint: new xb.UIText({
        text: HINT.loading,
        style: {fontSize: 12, color: '#8fa4c4', opacity: 0.85, textAlign: 'center', lineHeight: 1.35},
      }),
    };
    this.ui.relocate = new xb.UIButton({
      label: 'RELOCATE', icon: 'my_location', style: {flexGrow: 1},
      onClick: () => this.relocate(),
    });
    this.ui.reset = new xb.UIButton({
      label: 'RESET', icon: 'zoom_out_map', style: {flexGrow: 1},
      onClick: () => this.resetScale(),
    });
    this.ui.overlay = new xb.UIOverlay({
      style: {
        width: 620,
        position: 'absolute',
        left: '50%',
        bottom: 24,
        transform: {translateX: '-50%'},
      },
      children: [
        new xb.UIText({
          text: 'CITY//ORBIT',
          style: {fontSize: 28, fontWeight: 'bold', textAlign: 'center'},
        }),
        this.ui.mode,
        this.ui.stat,
        this.ui.poi,
        this.ui.hint,
        new xb.UIPanel({
          style: {width: '100%', flexDirection: 'row', gap: 12},
          children: [this.ui.relocate, this.ui.reset],
        }),
      ],
    });
    this.add(this.ui.overlay);
    this.renderMode();
  }

  setHint(text) { this.ui.hint.text = text; }

  renderMode() {
    const mode = this.ui.mode;
    if (!this.ready) {
      mode.text = this.status;
      mode.style.color = '#9fb2d2';
      return;
    }
    if (this.mode === 'live') {
      mode.text = `LIVE OSM · ${this.site.lat.toFixed(4)}, ${this.site.lon.toFixed(4)}`;
      mode.style.color = '#7ef0b0';
    } else {
      mode.text = `DEMO · ${this.reason}`;
      mode.style.color = '#ffc46b';
    }
  }

  renderStat() {
    if (!this.ready || !this.records.length) { this.ui.stat.text = ' '; return; }
    const zoom = this.cityRoot.scale.x / BASE_SCALE;
    this.ui.stat.text =
      `зданий ${this.records.length} · высота ${Math.round(this.hMin)}–${Math.round(this.hMax)} м · ` +
      `радиус ${RADIUS} м · масштаб ×${zoom < 0.1 ? zoom.toFixed(3) : zoom.toFixed(2)}`;
    // Строка POI: сколько точек и что ближе всего — как строка обстановки.
    if (!this.pois.length) {
      this.ui.poi.text = 'POI: нет точек в ответе — только город';
      return;
    }
    const near = this.pois[this.poiIndex >= 0 ? this.poiIndex : 0];
    const az = poiAzimuth(near);
    this.ui.poi.text =
      `POI ${this.pois.length} · ближайший: ${near.name} · ${Math.round(near.d)} м · ${az.rose}`;
  }

  // --- данные ---------------------------------------------------------------

  start() {
    if (AUTOMATION) {
      // Автоматизация: ни сети, ни разрешений, ни диалогов — только город.
      this.reason = 'синтетика (xrAutomation)';
      this.setHint(HINT.loading);
      this.install(demoQuarter(), 'demo');
      return;
    }
    this.locate();
  }

  locate() {
    if (!navigator.geolocation) {
      this.reason = 'нет геолокации';
      this.install(demoQuarter(), 'demo');
      return;
    }
    this.status = 'ГЕОПОЗИЦИЯ…';
    this.renderMode();
    navigator.geolocation.getCurrentPosition(
      (p) => {
        this.site = {
          lat: +p.coords.latitude.toFixed(5),
          lon: +p.coords.longitude.toFixed(5),
        };
        this.load();
      },
      () => {
        // Отказ в доступе — не ошибка опыта: координаты по умолчанию.
        this.reason = 'геопозиция недоступна, координаты по умолчанию';
        this.install(demoQuarter(), 'demo');
      },
      {timeout: 6000, maximumAge: 600000}
    );
  }

  async load() {
    const {lat, lon} = this.site;
    this.status = `OVERPASS · ${lat.toFixed(4)}, ${lon.toFixed(4)} …`;
    this.renderMode();
    this.abort = new AbortController();
    this.abortTimer = setTimeout(() => this.abort.abort(), OVERPASS_TIMEOUT);
    try {
      const json = await fetchOverpass(lat, lon, this.abort.signal);
      const records = recordsFromOverpass(json, this.site);
      if (!records.length) throw new Error('в радиусе нет зданий');
      this.install(records, 'live');
    } catch (e) {
      // OSM не ответил — молча в синтетику: опыт обязан остаться целым.
      if (this.abort && this.abort.signal.aborted) this.reason = 'OSM не ответил за 14 с';
      else this.reason = `OSM: ${e.message}`;
      this.install(demoQuarter(), 'demo');
    } finally {
      clearTimeout(this.abortTimer);
      this.abortTimer = 0;
      this.abort = null;
    }
  }

  // Полигоны → один InstancedMesh. Материал — голограмма: unlit, аддитив,
  // градиент по высоте считает шейдер (см. makeCityMaterial), а instanceColor
  // даёт только оттенок квартала. Плюс редкие глифы на крышах.
  install(records, mode) {
    this.disposeCity();
    this.records = records;
    this.mode = mode;
    if (mode === 'live') this.reason = '';
    if (!records.length) return;

    const geo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
    const mat = makeCityMaterial();
    const mesh = new THREE.InstancedMesh(geo, mat, records.length);
    const dummy = this._dummy;
    const color = this._color;
    let hMin = Infinity, hMax = 0;
    for (let i = 0; i < records.length; i++) {
      const b = records[i];
      dummy.position.set(b.cx, 0, b.cz);
      dummy.rotation.set(0, b.rot, 0);
      dummy.scale.set(Math.max(b.w, 2), b.h, Math.max(b.d, 2));
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      // Квартал (клетка 150 м) — свой оттенок множителем к градиенту высоты.
      const cell = (((Math.floor(b.cx / 150) * 7 + Math.floor(b.cz / 150) * 13) % 5) + 5) % 5;
      color.copy(C.low).lerp(C.high, ((cell * 3) % 5) / 4);
      mesh.setColorAt(i, color);
      if (b.h < hMin) hMin = b.h;
      if (b.h > hMax) hMax = b.h;
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    // Город — один объект, его габарит при масштабировании огромен: отсечение
    // по одной сфере всё равно не сработает, а лишний расчёт мешает.
    mesh.frustumCulled = false;
    mesh.name = 'buildings';
    this.buildings = mesh;
    this.cityRoot.add(mesh);

    // Глифы на крышах: редкие светящиеся точки — город читается как данные,
    // а не как застройка, и по ним видно высоту даже на мелком масштабе.
    this.glyphs = this.buildGlyphs(records);
    this.cityRoot.add(this.glyphs);
    mat.uniforms.uMaxHeight.value = Math.max(60, hMax);

    this.hMin = hMin;
    this.hMax = hMax;
    this.cityRoot.scale.setScalar(BASE_SCALE);
    this.syncPad();
    this.ready = true;
    this.model.visible = true;
    this.renderMode();
    this.renderStat();
    this.setHint(this.inSession ? HINT.grounding : HINT.ready);
    this.requestPlacement(this.inSession ? 0 : 1);
    // Слой POI: в live — второй лёгкий запрос, в демо — детерминированная
    // подстановка из тех же кварталов (офлайн-опыт остаётся полным).
    if (mode === 'live') this.loadPois();
    else this.installPois(demoPois(records));
  }

  // --- слой POI -------------------------------------------------------------

  // Второй, лёгкий запрос: точки вокруг. Слой необязательный, поэтому его
  // провал ничего не ломает — города он не касается.
  async loadPois() {
    const {lat, lon} = this.site;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), POI_TIMEOUT);
    try {
      const json = await fetchPois(lat, lon, ctrl.signal);
      if (this.ready) this.installPois(parsePois(json, this.site));
    } catch (e) {
      // Нет ответа или нет точек — просто нет слоя.
      if (this.ready) this.installPois([]);
    } finally {
      clearTimeout(timer);
    }
  }

  installPois(pois) {
    this.clearPois();
    this.pois = pois;
    if (!pois.length) {
      this.renderStat();
      return;
    }
    // Слой POI — надстройка над городом: любая его поломка (маркеры, плашки,
    // UI-подсистема) обязана оставить опыт с городом, а не без него.
    try {
      this.buildPoiMarkers(pois);
    } catch (e) {
      this.pois = [];
      this.clearPois();
    }
    this.renderStat();
  }

  buildPoiMarkers(pois) {
    // Все маркеры — один InstancedMesh: столбик со светящимся верхом. Высоту и
    // яркость ведёт дистанция (логарифм): дальние выше и тусклее, ближние
    // короче и ярче — так столбик читается как засветка на радаре.
    const geo = new THREE.CylinderGeometry(3.5, 3.5, 1, 8).translate(0, 0.5, 0);
    const mat = glowBlending(new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, depthWrite: false,
    }));
    const mesh = new THREE.InstancedMesh(geo, mat, pois.length);
    this.poiMarkers = mesh;
    const dummy = this._dummy;
    for (let i = 0; i < pois.length; i++) {
      const p = pois[i];
      p.label = poiKind(p.kind)[0];
      p.h = 16 + 30 * Math.log10(1 + p.d / 40);
      p.bright = Math.max(0.35, 1.1 - p.d / 520);
      dummy.position.set(p.cx, 0, p.cz);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, p.h, 1);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      this.setPoiColor(i, 1);
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.frustumCulled = false;
    mesh.name = 'poi-markers';
    this.poiGroup.add(mesh);

    // Подписи: 30 плашек на макете 90 см неразличимы, поэтому подписаны
    // ближайшие — остальные остаются маркерами и доступны кликом.
    for (const p of pois.slice(0, POI_LABELS)) {
      try {
        const card = new xb.UICard({
          size: {width: 0.12, height: 'auto'},
          pointerEvents: 'none',     // подпись не должна перехватывать ретикул
          children: [new xb.UIText({
            text: p.name,
            style: {fontSize: 11, color: '#cdefff', textAlign: 'center'},
          })],
        });
        card.add(new xb.FaceCamera({mode: 'spherical'}));
        this.add(card);
        this.labels.push({card, poi: p});
      } catch (e) {
        break;                       // подписи не критичны
      }
    }
  }

  setPoiColor(index, gain) {
    const p = this.pois[index];
    if (!p || !this.poiMarkers) return;
    this._color.setHex(poiKind(p.kind)[1]).multiplyScalar(p.bright * gain);
    this.poiMarkers.setColorAt(index, this._color);
    if (this.poiMarkers.instanceColor) this.poiMarkers.instanceColor.needsUpdate = true;
  }

  clearPois() {
    if (this.poiMarkers) {
      this.poiGroup.remove(this.poiMarkers);
      this.poiMarkers.geometry.dispose();
      this.poiMarkers.material.dispose();
      this.poiMarkers = null;
    }
    // Плашки снимаем со сцены, но не трогаем: их монтирует и убирает UI-подсистема.
    for (const {card} of this.labels) card.removeFromParent();
    this.labels = [];
    this.pois = [];
    this.hidePoi();
  }

  // Клик по маркеру: карточка рядом с ним; повторный тап закрывает.
  showPoi(index) {
    const p = this.pois[index];
    if (!p) return;
    if (this.poiIndex === index) {
      this.hidePoi();
      return;
    }
    if (this.poiIndex >= 0) this.setPoiColor(this.poiIndex, 1);
    this.poiIndex = index;
    this.setPoiColor(index, 1.8);
    if (this.poiCard && this.poiUi) {
      const az = poiAzimuth(p);
      this.poiUi.name.text = p.name;
      this.poiUi.info.text =
        `${p.label} · ${Math.round(p.d)} м · ${az.rose} (${Math.round(az.deg)}°)`;
      this.poiCard.visible = true;
    }
    this.renderStat();
  }

  hidePoi() {
    if (this.poiIndex >= 0) this.setPoiColor(this.poiIndex, 1);
    this.poiIndex = -1;
    if (this.poiCard) this.poiCard.visible = false;
    this.renderStat();
  }

  // «Центровать»: город доворачивается так, чтобы выбранный POI оказался на
  // луче «центр города → пользователь», то есть прямо перед ним.
  centerOnPoi() {
    const p = this.pois[this.poiIndex];
    const camera = xb.core?.camera;
    if (!p || !camera) return;
    camera.getWorldPosition(this._p);
    const toUser = Math.atan2(
      this._p.x - this.cityRoot.position.x,
      this._p.z - this.cityRoot.position.z
    );
    this.yawTarget = toUser - Math.atan2(p.cx, p.cz);
    this.setHint(`центрую на «${p.name}»`);
  }

  buildGlyphs(records) {
    const step = 7;
    const count = Math.max(1, Math.floor(records.length / step));
    const pos = new Float32Array(count * 3);
    let n = 0;
    for (let i = 0; i < records.length && n < count; i += step) {
      const b = records[i];
      pos[n * 3] = b.cx;
      pos[n * 3 + 1] = b.h + 5;
      pos[n * 3 + 2] = b.cz;
      n++;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos.subarray(0, n * 3), 3));
    const mat = glowBlending(new THREE.PointsMaterial({
      color: 0xd8fbff, map: glowSprite(), size: 26, sizeAttenuation: true,
      transparent: true, depthWrite: false, opacity: 0.9,
    }));
    const points = new THREE.Points(geo, mat);
    points.name = 'city-glyphs';
    points.frustumCulled = false;
    return points;
  }

  disposeCity() {
    const mesh = this.buildings;
    if (!mesh) return;
    this.cityRoot.remove(mesh);
    // InstancedMesh.dispose() освобождает instanceMatrix/instanceColor —
    // geometry.dispose() до них не достаёт.
    mesh.dispose();
    mesh.geometry.dispose();
    mesh.material.dispose();
    this.buildings = null;
    if (this.glyphs) {
      this.cityRoot.remove(this.glyphs);
      this.glyphs.geometry.dispose();
      this.glyphs.material.map?.dispose();
      this.glyphs.material.dispose();
      this.glyphs = null;
    }
  }

  // --- постановка на поверхность --------------------------------------------

  requestPlacement(delayFrames = 0) { this.placeAt = performance.now() + delayFrames * 20; }

  // Кнопка и удержание делают одно и то же: поставить город заново.
  relocate() {
    if (!this.ready) return;
    this.requestPlacement(0);
  }

  resetScale() {
    if (!this.ready) return;
    this.cityRoot.scale.setScalar(BASE_SCALE);
    this.syncPad();
    this.renderStat();
    this.requestPlacement(0);
  }

  ground() {
    if (!this.ready) return;
    if (!this.inSession) {
      // Плоский десктоп: ни плоскостей, ни глубины — сразу на виртуальный
      // пол, без ожидания таймаута, иначе город на секунду висит в голове.
      this.placeOnVirtualFloor();
      this.syncPad();
      this.setHint(HINT.noSurface);
      this.renderStat();
      return;
    }
    this.setHint(HINT.grounding);
    let ok = false;
    try {
      ok = this.placeOnReticle();
    } catch (e) {
      ok = false;
    }
    if (!ok) this.placeOnVirtualFloor();
    this.syncPad();
    this.setHint(ok ? HINT.ready : HINT.noSurface);
    this.renderStat();
  }

  // Ретикул пользователя уже нашёл поверхность — город встаёт туда: это
  // официальный placeOnSurface из 03_spatial_placement. Обратный вариант,
  // placeOnHorizontalSurface, здесь не годится: он обходит сцену через
  // Box3.setFromObject и падает на мешах uikit, из которых собран наш же HUD.
  // Берём первый луч, попавший в горизонтальную плоскость: стена или потолок
  // для города — не место.
  placeOnReticle() {
    const controllers = xb.core?.user?.controllers || [];
    if (!controllers.length) return false;
    this._pos.copy(this.cityRoot.position);
    this._quat.copy(this.cityRoot.quaternion);
    for (const controller of controllers) {
      if (!xb.world.placeOnSurface(this.cityRoot, controller)) continue;
      const up = this._d.set(0, 1, 0).applyQuaternion(this.cityRoot.quaternion).y;
      if (up > 0.85) return true;
      this.cityRoot.position.copy(this._pos);
      this.cityRoot.quaternion.copy(this._quat);
    }
    return false;
  }

  // Фолбэк: поверхностей рядом нет (flat-режим, пустая комната или ретикул не
  // на плоскости) — город встаёт на виртуальный пол y=0 в двух метрах перед
  // пользователем. Двух метров достаточно, чтобы город на полу попал в кадр
  // при взгляде прямо, а не уехал под нижний край. HUD при этом честно
  // называет пол виртуальным (HINT.noSurface).
  placeOnVirtualFloor() {
    const camera = xb.core?.camera;
    if (!camera) return;
    camera.getWorldPosition(this._p);
    camera.getWorldDirection(this._d);
    this._d.y = 0;
    if (this._d.lengthSq() < 1e-6) this._d.set(0, 0, -1);
    this._d.normalize();
    const reach = 2;
    this.cityRoot.position.set(
      this._p.x + this._d.x * reach, 0, this._p.z + this._d.z * reach
    );
    // Север (локальный −z) смотрит от пользователя: карта читается как карта.
    this.cityRoot.rotation.set(0, Math.atan2(-this._d.x, -this._d.z), 0);
  }

  // Полоса живёт одной позой с городом: копируем ежекадрово, это три присваивания.
  syncPad() {
    const pad = this.padGroup;
    if (!pad) return;
    pad.position.copy(this.cityRoot.position);
    pad.quaternion.copy(this.cityRoot.quaternion);
    pad.scale.copy(this.cityRoot.scale);
  }

  // --- взаимодействие -------------------------------------------------------

  onSimulatorStarted() {
    this.inSession = true;
    if (this.ready) this.requestPlacement(0);
  }

  onXRSessionStarted() {
    this.inSession = true;
    if (this.ready) this.requestPlacement(0);
  }

  onXRSessionEnded() { this.inSession = false; }

  onObjectLongSelect(event) {
    // Сюда попадает только то, что манипуляция не перехватила, — полоса
    // переноса. Удержание = «поставь город заново» (то же, что кнопка).
    if (this.ready) {
      this.setHint('ставлю город заново…');
      this.relocate();
    }
    event.stopPropagation();
  }

  onObjectSelectStart(event) {
    const surface = event.surface;
    if (surface === this.poiMarkers) {
      this.setHint('маркер POI — отпусти, чтобы открыть карточку');
    } else if (surface === this.padBand || surface === this.padRim) {
      this.hotTarget.pad = 1;
      this.setHint('удержание — поставить город на поверхность');
    } else if (surface === this.orbitRing) {
      this.hotTarget.orbit = 1;
    } else {
      this.hotTarget.body = 1;
    }
    event.stopPropagation();
  }

  onObjectSelectEnd(event) {
    this.hotTarget.pad = 0;
    this.hotTarget.orbit = 0;
    this.hotTarget.body = 0;
    // Клик по столбику POI (не перетаскивание) открывает карточку: маркеры —
    // один InstancedMesh, точный маркер даёт instanceId пересечения.
    const id = event.intersection?.instanceId;
    if (event.completed && event.surface === this.poiMarkers && id != null) {
      this.showPoi(id);
    }
    event.stopPropagation();
  }

  onHoverEnter(event) {
    const surface = event.surface;
    if (surface === this.orbitRing) this.hotTarget.orbit = 1;
    else if (surface === this.padBand || surface === this.padRim) this.hotTarget.pad = 1;
    else if (surface === this.poiMarkers) this.setHint('POI: клик — карточка точки');
    else this.hotTarget.body = 1;
    event.stopPropagation();
  }

  onHoverExit() {
    this.hotTarget.orbit = 0;
    this.hotTarget.pad = 0;
    this.hotTarget.body = 0;
  }

  onObjectManipulate(event) {
    // Скан-полоса: виден признак, что город сейчас «в работе».
    this.scanOn = event.phase === 'start' || event.phase === 'update';
    if (event.phase === 'start') {
      const what = event.action === xb.ManipulationAction.Rotate ? 'вращение'
        : event.action === xb.ManipulationAction.Scale ? 'масштаб' : 'перенос';
      this.setHint(`${what} · второй источник — масштаб · удержание на полосе — постановка`);
    } else if (event.phase === 'end' || event.phase === 'cancel') {
      this.scanOn = false;
      this.setHint(HINT.ready);
      this.renderStat();
    }
    event.stopPropagation();
  }

  // --- кадр -----------------------------------------------------------------

  update() {
    const dt = Math.min(xb.getDeltaTime(), 0.05);
    this.t += dt;

    if (this.placeAt !== null && performance.now() >= this.placeAt) {
      this.placeAt = null;
      this.ground();
    }

    this.syncPad();
    this.stepFeedback(dt);

    // Подписи висят над своими маркерами (мир, а не масштаб города).
    if (this.labels.length) {
      for (const {card, poi} of this.labels) {
        this._p.set(poi.cx, poi.h + 9, poi.cz);
        this.cityRoot.localToWorld(this._p);
        card.position.copy(this._p);
      }
    }
    if (this.poiIndex >= 0 && this.poiCard) {
      const p = this.pois[this.poiIndex];
      this._p.set(p.cx, p.h * 0.8, p.cz);
      this.cityRoot.localToWorld(this._p);
      this.poiCard.position.copy(this._p).add(POI_CARD_OFFSET);
    }

    // Плавный доворот «центровать»: город идёт к цели, а не прыгает.
    if (this.yawTarget !== null) {
      const delta = Math.atan2(
        Math.sin(this.yawTarget - this.cityRoot.rotation.y),
        Math.cos(this.yawTarget - this.cityRoot.rotation.y)
      );
      this.cityRoot.rotation.y += delta * Math.min(1, dt * 4);
      if (Math.abs(delta) < 0.01) {
        this.cityRoot.rotation.y = this.yawTarget;
        this.yawTarget = null;
        this.setHint(HINT.ready);
      }
    }

    this._fp += dt;
    if (this._fp >= 0.4) {
      this._fp = 0;
      this.renderStat();
    }
  }

  stepFeedback(dt) {
    const k = Math.min(1, dt * 6);
    for (const key of ['orbit', 'pad', 'body']) {
      this.hot[key] += (this.hotTarget[key] - this.hot[key]) * k;
    }
    const pulse = 0.5 + 0.5 * Math.sin(this.t * 2.4);
    this.orbitMat.opacity = 0.34 + 0.3 * this.hot.orbit + 0.08 * pulse;
    this.padBandMat.opacity = 0.16 + 0.3 * this.hot.pad + 0.05 * pulse;
    this.padRimMat.opacity = 0.34 + 0.45 * this.hot.pad + 0.1 * pulse;
    this.northMat.opacity = 0.45 + 0.2 * pulse;
    this.markerMat.opacity = 0.7 + 0.3 * pulse;
    this.plateMat.uniforms.uGlow.value = 1 + 0.6 * this.hot.body;
    this.radarMat.uniforms.uPhase.value = this.t * 1.1;
    const beat = 1 + 0.06 * pulse;
    this.marker.scale.setScalar(beat);

    // Скан-полоса бежит по высоте города, пока его держат (и плавно гаснет).
    this.scanT = (this.scanT + dt * 0.45) % 1;
    this.scanK += ((this.scanOn ? 1 : 0) - this.scanK) * Math.min(1, dt * 5);
    const city = this.buildings?.material?.uniforms;
    if (city) {
      city.uScan.value = this.scanT;
      city.uScanOn.value = this.scanK;
    }
  }

  // --- уборка ---------------------------------------------------------------

  dispose() {
    if (this.abortTimer) clearTimeout(this.abortTimer);
    if (this.abort) this.abort.abort();
    this.abortTimer = 0;
    this.abort = null;
    this.placeAt = null;
    this.yawTarget = null;
    this.disposeCity();
    this.clearPois();
    this.poiCard?.removeFromParent();

    // Геометрии и материалы частей города — наши; сам UIOverlay принадлежит
    // UI-подсистеме XR Blocks и убирается ею, чужие меши не трогаем.
    const drop = (object) => {
      if (!object) return;
      object.traverse?.((child) => {
        child.geometry?.dispose();
        if (!child.material) return;
        const materials = Array.isArray(child.material) ? child.material : [child.material];
        for (const m of materials) {
          m.map?.dispose();
          m.dispose();
        }
      });
    };
    for (const part of [this.plate, this.orbitRing, this.marker, this.north, this.radar, this.padGroup]) {
      drop(part);
    }
    this.records = [];
    this.ready = false;
  }
}

const options = new xb.Options();
options.enableReticles();
// Плоскости — поверхность для города; depth — реальные препятствия под
// ретикулом. Где сенсоров нет (телефон), installXrGuards повторяет запрос
// сессии без них, и город просто встаёт туда, где видит пользователь.
options.enablePlaneDetection();
options.enableDepth();
options.reticles.projectOnDepthMesh = true;
options.interaction.longSelectDuration = 0.9;
// Десктопный симулятор: мышь — луч контроллера (как в 02_object_interaction),
// иначе город нельзя ни взять, ни повернуть мышью.
options.simulator.defaultMode = xb.SimulatorMode.CONTROLLER;
options.world.planes.showDebugVisualizations = DEBUG;
options.xrButton.showEnterSimulatorButton = true;
options.setAppTitle('CITY//ORBIT');
options.setAppDescription('Твой район из OpenStreetMap — город одним объектом: возьми, поверни, увеличь до улиц.');

installXrGuards();
if (AUTOMATION) document.body.classList.add('automation');

document.addEventListener('DOMContentLoaded', () => {
  xb.add(new CityOrbit());
  xb.init(options);
  watchXrButton([
    'Вход — кнопка по центру: голограмма города соберётся перед тобой',
    'Тянуть город — перенос, кольцо вокруг — вращение, второй источник — масштаб',
    'Наведи ретикул на стол или пол и нажми RELOCATE (или удержи полосу) — город встанет туда',
    'Нет поверхностей — город встанет на виртуальный пол, об этом скажет статус',
  ]);
});
</script>
</body>
</html>
