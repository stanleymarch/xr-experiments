<script type="module">
// WEATHER//ROOM — свежая реализация по официальному пути XR Blocks.
//
// ИДЕЯ: живая погода твоей точки (Open-Meteo, без ключа) становится телом
// комнаты. Дождь и снег падают вокруг и всплескиваются на реальных
// поверхностях, потолок комнаты затягивает облачная плита, воздух густеет
// мглой по видимости, ночью проступают звёзды, ветер сносит капли и снег.
// Слайдер мотает время −24…+24 ч. Каждое поле ответа имеет видимую причину:
//   rain+showers → число капель, скорость и крупность дождя
//   snowfall     → снежинки
//   cloud_cover  → плотность плиты и объёмного облака над головой
//   visibility, weather_code 45/48 → мгла
//   wind (speed+direction)  → снос капель, снега и дрейф плиты
//   pressure_msl → высота облачного потолка
//   is_day → палитра, звёзды, уровень света
//
// ВОПЛОЩЕНИЕ — официальные образцы, не выдумка:
//   дождь: механика samples/advanced/rain — инстансы квадов с азимутальным
//     билбордом; кадр 0 спрайт-листа — летящая капля, кадры 1–15 — всплеск,
//     который проигрывается на том же кваде (weight 1→30); окклюзия и
//     посадка — по depth-сенсору (getDepth), 10% капель рождается прямо на
//     реальной геометрии лучом из камеры;
//   облако: аддон VolumetricCloud, как в том же сэмпле;
//   скелет: золотой промпт Gemini Canvas — один файл, import-map CDN,
//     xb.Script, встроенный spatial UI (UIOverlay), дефолтный симулятор.
//
// Инлайненные device-контракты (причины — в XR-BLOCKS.md корня):
//   glowBlending — premultiplied-alpha телефонного AR (аддитив копит альфу
//     канваса — композитор гасит камеру под «свечением»);
//   installXrGuards — телефонный Chrome отклоняет сессию с required
//     depth-sensing/hand-tracking/local-floor; повторный запрос без них;
//   isPassthrough/hideInPassthrough — 'alpha-blend' = телефон; VR-декорации
//     комнаты в AR прячутся, объёмное облако в alpha-blend не ставится
//     (чужой premultiplied RawShaderMaterial переключать вслепую нельзя).

import * as THREE from 'three';
import * as xb from 'xrblocks';
import { VolumetricCloud } from 'xrblocks/addons/volumes/VolumetricCloud.js';

const AUTOMATION = new URLSearchParams(window.location.search).has('xrAutomation');
const DEBUG = new URLSearchParams(window.location.search).has('debug');

// --- контракты --------------------------------------------------------------

function glowBlending(material) {
  material.blending = THREE.CustomBlending;
  material.blendSrc = THREE.SrcAlphaFactor;
  material.blendDst = THREE.OneFactor;
  material.blendSrcAlpha = THREE.ZeroFactor;
  material.blendDstAlpha = THREE.OneFactor;
  return material;
}

// Процедурный мягкий спрайт для точечных слоёв (звёзды): без файлов.
function glowSprite() {
  const S = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const dx = (x - S / 2) / (S / 2), dy = (y - S / 2) / (S / 2);
      const r = Math.hypot(dx, dy);
      const v = r > 1 ? 0 : Math.pow(1 - r, 2.2);
      const i = (y * S + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
      img.data[i + 3] = Math.round(v * 255);
    }
  }
  g.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(cv);
}

// Телефонный AR-passthrough: Quest отдаёт 'additive', телефоны 'alpha-blend'.
function isPassthrough() {
  const session = xb.core?.renderer?.xr?.getSession?.();
  return Boolean(session) && session.environmentBlendMode === 'alpha-blend';
}

function hideInPassthrough(objects) {
  const xr = xb.core?.renderer?.xr;
  if (!xr) return;
  const sync = () => {
    const ar = isPassthrough();
    for (const object of objects) if (object) object.visible = !ar;
  };
  xr.addEventListener('sessionstart', sync);
  xr.addEventListener('sessionend', sync);
}

function installXrGuards() {
  const xr = navigator.xr;
  if (!xr || xr.__downgradeGuard) return;
  xr.__downgradeGuard = true;
  const orig = xr.requestSession.bind(xr);
  xr.requestSession = (mode, init) =>
    orig(mode, init).catch((err) => {
      const required = (init && init.requiredFeatures) || [];
      const heavy = required.filter(
        (f) => f === 'depth-sensing' || f === 'hand-tracking' || f === 'local-floor'
      );
      if (!heavy.length) throw err;
      init.requiredFeatures = required.filter((f) => !heavy.includes(f));
      return orig(mode, init);
    });
}

// Класс .in-session на #XRButtonWrapper (кнопка стала END XR) + подсказки
// внутрь официального entry-экрана. Wrapper появляется внутри xb.init().
function watchXrButton(hints = []) {
  const sync = (w) => {
    const btn = w.querySelector('button');
    if (btn) w.classList.toggle('in-session', /end/i.test(btn.textContent));
  };
  const attach = () => {
    const w = document.getElementById('XRButtonWrapper');
    if (!w) return false;
    if (hints.length && !w.querySelector('.app-hints')) {
      const list = document.createElement('ul');
      list.className = 'app-hints';
      for (const hint of hints) {
        const item = document.createElement('li');
        item.textContent = hint;
        list.append(item);
      }
      w.append(list);
    }
    sync(w);
    new MutationObserver(() => sync(w)).observe(w, {
      childList: true, characterData: true, subtree: true,
    });
    return true;
  };
  if (attach()) return;
  const io = new MutationObserver(() => { if (attach()) io.disconnect(); });
  io.observe(document.body, { childList: true, subtree: false });
}

// --- погода: данные -----------------------------------------------------------

// Коды WMO: [от, до, имя].
const WMO = [
  [0, 0, 'CLEAR'], [1, 1, 'MOSTLY CLEAR'], [2, 2, 'PARTLY CLOUDY'], [3, 3, 'OVERCAST'],
  [45, 48, 'FOG'], [51, 55, 'DRIZZLE'], [56, 57, 'FREEZING DRIZZLE'],
  [61, 61, 'LIGHT RAIN'], [63, 63, 'RAIN'], [65, 65, 'HEAVY RAIN'],
  [66, 67, 'FREEZING RAIN'], [71, 71, 'LIGHT SNOW'], [73, 73, 'SNOW'],
  [75, 75, 'HEAVY SNOW'], [77, 77, 'SNOW GRAINS'], [80, 80, 'SHOWERS'],
  [81, 81, 'HEAVY SHOWERS'], [82, 82, 'VIOLENT SHOWERS'], [85, 86, 'SNOW SHOWERS'],
  [95, 95, 'THUNDERSTORM'], [96, 99, 'THUNDERSTORM + HAIL'],
];
const ROSE = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (v, d) => (typeof v === 'number' && Number.isFinite(v) ? v : d);
const dirName = (deg) => ROSE[Math.round((((deg % 360) + 360) % 360) / 45) % 8];

function conditionName(code) {
  for (const [a, b, label] of WMO) if (code >= a && code <= b) return label;
  return 'НЕИЗВЕСТНО';
}

// Синтетика на случай отсутствия сети: согласованный суточный ход, фронт
// раз в ~56 ч, мороз превращает дождь в снег, провал видимости — туман.
function demoData() {
  const now = Date.now();
  const base = now - (now % 3600e3);
  const time = [];
  for (let i = -24; i <= 48; i++) time.push(new Date(base + i * 3600e3).toISOString());
  const n = time.length;
  const h = {
    time, temperature_2m: [], relative_humidity_2m: [], precipitation: [],
    rain: [], showers: [], snowfall: [], weather_code: [], cloud_cover: [],
    visibility: [], wind_speed_10m: [], wind_gusts_10m: [], wind_direction_10m: [],
    pressure_msl: [], is_day: [],
  };
  for (let i = 0; i < n; i++) {
    const hour = new Date(time[i]).getHours();
    const diurnal = Math.sin(((hour - 9) / 24) * Math.PI * 2);
    const storm = Math.sin((i + 5) / 9);
    const temp = 2 + 9 * diurnal + 4 * Math.sin(i / 13);
    const foggy = storm < -0.7;
    let rain = 0, showers = 0, snow = 0, code = 1;
    if (foggy) code = 45;
    else if (storm > 0.5) {
      showers = 0.6 + 2.4 * (storm - 0.5);
      code = showers > 1.8 ? 82 : showers > 1.0 ? 81 : 80;
    } else if (storm > 0.1) {
      rain = 0.15 + 0.75 * storm;
      code = rain > 0.6 ? 63 : 61;
    } else code = storm > -0.3 ? 2 : 0;
    if (temp < 1.2 && rain + showers > 0) {
      snow = (rain + showers) * 0.8;
      rain = showers = 0;
      code = snow > 0.8 ? 75 : snow > 0.3 ? 73 : 71;
    }
    const wet = rain + showers + snow;
    let cloud = foggy ? 95 : clamp(14 + 62 * Math.max(0, storm) + 34 * Math.min(1, wet), 4, 98);
    if (wet > 0.02) cloud = Math.max(cloud, 62 + 33 * Math.min(1, wet));
    cloud = Math.round(cloud);
    h.temperature_2m.push(Math.round(temp * 10) / 10);
    h.relative_humidity_2m.push(Math.round(clamp(52 + 0.35 * cloud + 14 * Math.min(1, wet) - 10 * diurnal, 28, 99)));
    h.precipitation.push(Math.round((rain + showers + snow * 0.7) * 100) / 100);
    h.rain.push(Math.round(rain * 100) / 100);
    h.showers.push(Math.round(showers * 100) / 100);
    h.snowfall.push(Math.round(snow * 100) / 100);
    h.weather_code.push(code);
    h.cloud_cover.push(cloud);
    h.visibility.push(Math.round(clamp(26000 - 170 * cloud - 4200 * wet - (foggy ? 24500 : 0), 250, 32000)));
    h.wind_speed_10m.push(Math.round((1.8 + 5.2 * Math.abs(storm)) * 10) / 10);
    h.wind_gusts_10m.push(Math.round((1.8 + 5.2 * Math.abs(storm)) * (1.6 + 0.5 * Math.abs(storm)) * 10) / 10);
    h.wind_direction_10m.push(Math.round(235 + 45 * Math.sin(i / 13)));
    h.pressure_msl.push(Math.round((1014 + 9 * Math.sin(i / 17) - 10 * Math.max(0, storm)) * 10) / 10);
    h.is_day.push(hour >= 7 && hour < 21 ? 1 : 0);
  }
  return { hourly: h };
}

async function fetchWeather(lat, lon) {
  const q = new URL('https://api.open-meteo.com/v1/forecast');
  q.search = new URLSearchParams({
    latitude: String(lat), longitude: String(lon),
    hourly: [
      'temperature_2m', 'relative_humidity_2m', 'precipitation', 'rain', 'showers',
      'snowfall', 'weather_code', 'cloud_cover', 'visibility', 'wind_speed_10m',
      'wind_gusts_10m', 'wind_direction_10m', 'pressure_msl', 'is_day',
    ].join(','),
    past_days: '1', forecast_days: '2', timezone: 'auto',
  }).toString();
  const r = await fetch(q);
  if (!r.ok) throw new Error(`meteo ${r.status}`);
  return r.json();
}

// --- атмосфера комнаты: шейдеры ----------------------------------------------

// Облачная плита потолка: тайлящийся value-noise, едет по ветру без швов.
const DECK_VERT = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;
const DECK_FRAG = /* glsl */`
  uniform vec3 uColor;
  uniform vec2 uDrift;
  uniform float uCover, uLum;
  varying vec2 vUv;

  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

  float vnoise(vec2 p, float period) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    vec2 a = mod(i, period), b = mod(i + 1.0, period);
    return mix(
      mix(hash(vec2(a.x, a.y)), hash(vec2(b.x, a.y)), f.x),
      mix(hash(vec2(a.x, b.y)), hash(vec2(b.x, b.y)), f.x),
      f.y);
  }

  void main() {
    vec2 p = vUv * 7.0 + uDrift;
    float n = vnoise(p, 7.0) * 0.62 + vnoise(p * 2.3, 16.0) * 0.26 + vnoise(p * 4.7, 33.0) * 0.12;
    float t = clamp((n - (1.06 - uCover * 1.05)) / 0.22, 0.0, 1.0);
    float edge = smoothstep(1.0, 0.3, length(vUv - 0.5) * 2.0);
    gl_FragColor = vec4(uColor * uLum * (0.5 + 0.6 * t), uCover * t * edge * 0.92);
  }`;

// Мгла — сфера вокруг комнаты: хуже видимость — гуще пелена у пола.
const HAZE_VERT = /* glsl */`
  varying float vY;
  void main() {
    vY = clamp(normalize(position).y * 0.5 + 0.5, 0.0, 1.0);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;
const HAZE_FRAG = /* glsl */`
  uniform vec3 uColor;
  uniform float uFog, uLum;
  varying float vY;
  void main() {
    gl_FragColor = vec4(uColor * uLum, uFog * mix(0.5, 0.05, vY));
  }`;

const FLAT_QUAT = new THREE.Quaternion().setFromAxisAngle(

// Иконка погоды (Material Symbols) по коду WMO и времени суток.
function iconFor(s) {
  const c = s.code;
  const suffix = s.isDay ? '_day' : '_night';
  if (c === 0) return 'clear' + suffix;
  if (c === 1) return 'partly_cloudy' + suffix;
  if (c <= 3) return 'cloud';
  if (c <= 48) return 'fog';
  if (c <= 67) return 'rainy';
  if (c <= 77 || (c >= 85 && c <= 86)) return 'snowing';
  if (c <= 82) return 'rainy';
  return 'thunderstorm';
}

// --- опыт --------------------------------------------------------------------

class WeatherRoom extends xb.Script {
  init() {
    this.state = {
      temp: 8, rh: 65, cloud: 50, wind: 4, gust: 6, wdir: 225, press: 1010,
      vis: 15000, rain: 0, showers: 0, snow: 0, code: 2, isDay: 1, precip: 0,
    };
    this.offset = 0;
    this.rainK = 0; this.showerK = 0; this.snowK = 0;
    // Префикс телеметрии: источник данных виден всегда, а не один кадр.
    this.source = 'ПОИСК…';
    this.surfaces = [];        // горизонтальные плоскости комнаты (детектор)
    this._surfaceAge = 0;
    this.stains = null;        // пул мокрых пятен — ленивый
    this._stainCd = 0;
    this.flakes = null;        // накопление снега на полу — ленивый
    this.data = null;
    this.lat = 59.934; this.lon = 30.335;
    this._fp = 0;

    // Пол и комната: VR-интерьер, в AR прячется. Lit-материалы — как в
    // официальных сценах, а не flat-Basic: комнату видно и понятно с первого
    // кадра, дождь стучит по столу, сетка читает масштаб.
    this.floor = new THREE.Mesh(
      new THREE.PlaneGeometry(CFG.atm.x * 3, CFG.atm.z * 3),
      new THREE.MeshPhongMaterial({
        color: 0x27506e, transparent: true, opacity: 0.55,
        shininess: 80, specular: 0x9fd8ff,
      })
    );
    this.floor.rotation.x = -Math.PI / 2;
    this.add(this.floor);
    // Свет — паттерн официальных шаблонов; интенсивностью дышит погода ниже.
    this.hemi = new THREE.HemisphereLight(0xffffff, 0x46536b, 2.4);
    this.add(this.hemi);
    this.sun = new THREE.DirectionalLight(0xdfeaff, 1.1);
    this.sun.position.set(2.5, 4, -1.5);
    this.add(this.sun);
    this.room = this.buildRoom();

    this.buildDeck();
    this.buildHaze();
    this.buildStars();
    this.snow = this.buildSnow();        // меш появится после загрузки текстуры
    this.drops = null;                   // система дождя — после спрайт-листа
    this.loadTextures();
    this.buildCloudVolume();
    this.moteL = this.buildMotes();     // аэрозоль влажности

    this.buildHud();
    hideInPassthrough([this.hazeMesh, this.deckMesh, this.floor, ...this.room.parts]);
    this._arGain = 1;
    const xr = xb.core?.renderer?.xr;
    const syncArGain = () => { this._arGain = isPassthrough() ? 1.3 : 1; };
    xr?.addEventListener('sessionstart', syncArGain);
    xr?.addEventListener('sessionend', syncArGain);

    this.listener = null;
    this.rainSound = null;
    this.soundOn = false;
    this.soundReady = false;
    this.soundFailed = false;

    this.deckY = 2.3;
    this.cloud = 0.5;
    this.fogK = 0;
    this.dayK = 1;
    this.lumK = 0.8;
    this.starK = 0;
    this.flash = 0;
    this.flashT = 4;
    this.drift = new THREE.Vector2();
    this.deckColorT = C.deckDay.clone();
    this.hazeColorT = C.hazeDay.clone();
    this.cloudTint = C.cloudDay.clone();
    this._cloudTint = new THREE.Color();

    if (AUTOMATION) {

      this.state = {

  stat(s) { this.ui.src.text = s; }

  // Десктопные шорткаты: стрелки мотают время, N — сейчас, L — локация,
  // S — звук. Клик-путь (кнопки −1ч/+1ч) не зависит от драга мышью.
  onKeyDown(event) {
    const k = event.key;
    if (k === 'ArrowLeft' || k === '[') this.stepTime(-1);
    else if (k === 'ArrowRight' || k === ']') this.stepTime(1);
    else if (k === 'n' || k === 'N' || k === 'Home') {
      this.offset = 0;
      this.ui.slider.value = 0;
      this.applyHour();
    } else if (k === 'l' || k === 'L') this.locate();
    else if (k === 's' || k === 'S') this.toggleSound();
  }

  stepTime(delta) {
    this.offset = clamp(Math.round((this.offset + delta) * 4) / 4, -24, 24);
    this.ui.slider.value = this.offset;
    this.applyHour();
  }

  // Текстуры официального сэмпла rain — локальные ассеты опыта.
  loadTextures() {
    const loader = new THREE.TextureLoader();
    loader.load('textures/rain_sprite_sheet.png', (t) => {
      t.colorSpace = THREE.SRGBColorSpace;
      this.buildDrops(t);
    });
    loader.load('textures/snowflake1.png', (t) => {
      // Файл сэмпла — непрозрачный квадрат (проверено пикселями): строим
      // альфу вырезанием по яркости с авто-полярностью фона, иначе снежинки
      // падают «кубиками».
      const S = t.image.width;
      const cv = document.createElement('canvas');
      cv.width = cv.height = S;
      const ctx = cv.getContext('2d');
      ctx.drawImage(t.image, 0, 0);
      const img = ctx.getImageData(0, 0, S, S);
      const d = img.data;
      const invert = d[0] > 127; // фон в углу кадра
      for (let i = 0; i < d.length; i += 4) {
        const l = Math.max(d[i], d[i + 1], d[i + 2]);
        const shape = invert ? 255 - l : l;
        d[i] = d[i + 1] = d[i + 2] = 255;
        d[i + 3] = shape;
      }
      ctx.putImageData(img, 0, 0);
      const cut = new THREE.CanvasTexture(cv);
      cut.colorSpace = THREE.SRGBColorSpace;
      if (this.snow.mat.uniforms.map) this.snow.mat.uniforms.map.value = cut;
    });
  }

  // Система дождя: механика samples/advanced/rain. Инстансы квадов;
  // aWeight 0 = полёт (кадр 0 листа — капля), 1…30 = всплеск на месте
  // посадки (квад кладётся горизонтально, кадры идут по листу 4×4);
  // aVisibility гасит каплю за реальной геометрией.
  buildDrops(texture) {
    const count = CFG.drops;
    const geo = new THREE.PlaneGeometry(1, 1);
    const weights = new Float32Array(count);
    const visibility = new Float32Array(count).fill(1);
    geo.setAttribute('aWeight', new THREE.InstancedBufferAttribute(weights, 1)
      .setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aVisibility', new THREE.InstancedBufferAttribute(visibility, 1)
      .setUsage(THREE.DynamicDrawUsage));
    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        uTexture: { value: texture },
        uCameraPosition: { value: new THREE.Vector3() },
        uOpacity: { value: 0.8 },
        uLit: { value: 1 },
        uStretch: { value: CFG.dropStretch },
        uLeanWorld: { value: new THREE.Vector3() },
      },
      vertexShader: /* glsl */`
        attribute float aWeight;
        attribute float aVisibility;
        varying float vWeight;
        varying float vVisibility;
        varying vec2 vUv;
        uniform vec3 uCameraPosition;
        uniform float uStretch;
        uniform vec3 uLeanWorld;
        void main() {
          vUv = uv;
          vWeight = aWeight;
          vVisibility = aVisibility;
          vec4 worldPosition = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
          vec3 rotatedPosition;
          if (vWeight < 1.5) {
            // Билборд по азимуту: поворот вокруг Y к камере (как в сэмпле).
            vec3 toCamera = uCameraPosition - worldPosition.xyz;
            toCamera.y = 0.0;
            toCamera = normalize(toCamera);
            float angle = atan(toCamera.x, toCamera.z);
            mat3 rotationMatrix = mat3(
              cos(angle), 0.0, -sin(angle),
              0.0,        1.0,  0.0,
              sin(angle), 0.0,  cos(angle)
            );
            rotatedPosition = rotationMatrix * position;
            // Росчерк: летящий квад вытягивается по вертикали.
            rotatedPosition.y *= uStretch;
          } else {
            // Всплеск: квад кладётся горизонтально (поворот X на 90°).
            float angle = 1.5707963;
            mat3 rotationMatrix = mat3(
              1.0, 0.0,        0.0,
              0.0, cos(angle), -sin(angle),
              0.0, sin(angle),  cos(angle)
            );
            rotatedPosition = rotationMatrix * position;
          }
          vec4 finalPosition = instanceMatrix * vec4(rotatedPosition, 1.0);
          // Снос ветром: верх росчерка отклоняется по миру, только в полёте.
          finalPosition.xyz += uLeanWorld * (1.0 - step(1.5, vWeight)) * (vUv.y - 0.5);
          gl_Position = projectionMatrix * viewMatrix * finalPosition;
        }`,
      fragmentShader: /* glsl */`
        uniform sampler2D uTexture;
        uniform float uOpacity;
        uniform float uLit;
        varying float vWeight;
        varying float vVisibility;
        varying vec2 vUv;
        void main() {
          vec2 uv = vUv * 0.25;  // сетка 4×4
          float frame = floor(vWeight / ${CFG.splashSpeed.toFixed(1)});
          float xIndex = mod(frame, 4.0);
          float yIndex = floor(frame / 4.0);
          uv += vec2(xIndex, 3.0 - yIndex) * 0.25;
          vec4 c = texture2D(uTexture, uv);
          float a = c.a * vVisibility * uOpacity;
          if (a < 0.02) discard;
          gl_FragColor = vec4(pow(c.rgb, vec3(0.5)) * uLit, a);
        }`,
    });
    const mesh = new THREE.InstancedMesh(geo, mat, count);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.frustumCulled = false;
    mesh.count = 0;
    this.add(mesh);
    const dropMul = new Float32Array(count);
    const dropSize = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      dropMul[i] = 0.8 + Math.random() * 0.4;
      dropSize[i] = 0.7 + Math.random() * 0.6;
    }
    this.drops = {
      mesh, mat, count, weights, visibility,
      weightAttr: geo.attributes.aWeight,
      visAttr: geo.attributes.aVisibility,
      active: 0,
      dropMul, dropSize,
      pos: new Float32Array(count * 3).fill(-60),
      fall: 4,
    };
    this.applyDropCount();
  }

  buildSnow() {
    const count = CFG.snow;
    const pos = new Float32Array(count * 3).fill(-60);
    const geo = new THREE.BufferGeometry();
    const pa = new THREE.BufferAttribute(pos, 3);
    pa.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('position', pa);
    const mat = glowBlending(new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        map: { value: glowSprite() },
        uSize: { value: 0.05 },
        uColor: { value: new THREE.Color(0xeef6ff) },
        uOpacity: { value: 0 },
      },
      vertexShader: /* glsl */`
        varying float vFog;
        uniform float uSize;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float dist = max(0.1, -mv.z);
          gl_PointSize = uSize * 900.0 / dist;
          vFog = exp(-dist * 0.12);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        varying float vFog;
        uniform sampler2D map;
        uniform vec3 uColor;
        uniform float uOpacity;
        void main() {
          float a = texture2D(map, gl_PointCoord).a;
          gl_FragColor = vec4(uColor * vFog, a * uOpacity);
        }`,
    }));
    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    this.add(points);
    return {
      count, pos, geo, mat, points, active: 0, posAttr: pa,
      phase: new Float32Array(count).map(() => Math.random() * Math.PI * 2),
    };
  }

  buildStars() {
    const count = CFG.stars;
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const u = Math.random() * 0.9 + 0.1;
      const phi = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.max(0, 1 - u * u)) * 5;
      const ix = i * 3;
      pos[ix] = Math.cos(phi) * r;
      pos[ix + 1] = 1.2 + u * 3.8;
      pos[ix + 2] = Math.sin(phi) * r;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = glowBlending(new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        map: { value: glowSprite() },
        uSize: { value: 0.03 },
        uColor: { value: C.star.clone() },
        uOpacity: { value: 0 },
      },
      vertexShader: /* glsl */`
        varying float vFog;
        uniform float uSize;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float dist = max(0.1, -mv.z);
          gl_PointSize = uSize * 900.0 / dist;
          vFog = exp(-dist * 0.06);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        varying float vFog;
        uniform sampler2D map;
        uniform vec3 uColor;
        uniform float uOpacity;
        void main() {
          float a = texture2D(map, gl_PointCoord).a;
          gl_FragColor = vec4(uColor * vFog, a * uOpacity);
        }`,
    }));
    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    this.add(points);
    this.stars = { count, pos, geo, mat, points };
  }

  // Комната: lit-интерьер вокруг пользователя — стены, окно с рамой и стеклом,
  // стол, скамья, сетка пола. Даёт понятность пространства и твёрдые
  // поверхности, по которым капли стучат (room.surfaces → surfaceAt).
  buildRoom() {
    const group = new THREE.Group();
    this.add(group);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a4c63, roughness: 0.92, metalness: 0.02 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x70583f, roughness: 0.68, metalness: 0.03 });
    const half = 3.5, H = 3.6;
    const put = (mesh) => { group.add(mesh); return mesh; };
    // Задняя стена с окном: две колонны, перемычка, подоконник.
    const winW = 2.1, winH = 1.5, winY = 1.75;
    const colW = (half * 2 - winW) / 2;
    for (const side of [-1, 1]) {
      put(new THREE.Mesh(new THREE.BoxGeometry(colW, H, 0.12), wallMat))
        .position.set(side * (winW / 2 + colW / 2), H / 2, -half);
    }
    put(new THREE.Mesh(new THREE.BoxGeometry(winW, H - winY - winH / 2, 0.12), wallMat))
      .position.set(0, (H + winY + winH / 2) / 2, -half);
    put(new THREE.Mesh(new THREE.BoxGeometry(winW, winY - winH / 2, 0.12), wallMat))
      .position.set(0, (winY - winH / 2) / 2, -half);
    this.glassMat = new THREE.MeshPhongMaterial({
      color: 0x18243a, transparent: true, opacity: 0.35,
      shininess: 90, specular: 0xcfe8ff, side: THREE.DoubleSide,
    });
    put(new THREE.Mesh(new THREE.PlaneGeometry(winW, winH), this.glassMat))
      .position.set(0, winY, -half + 0.02);
    // Боковые стены.
    for (const side of [-1, 1]) {
      put(new THREE.Mesh(new THREE.BoxGeometry(0.12, H, half * 2), wallMat))
        .position.set(side * half, H / 2, 0);
    }
    // Сетка пола — масштаб и «поверхность» читаются сразу.
    const grid = new THREE.GridHelper(half * 2, 14, 0x54d6ff, 0x24425c);
    grid.position.y = 0.01;
    grid.material.transparent = true;
    grid.material.opacity = 0.35;
    grid.material.depthWrite = false;
    put(grid);
    // Стол и скамья: твёрдые поверхности для посадки капель.
    const tableX = 0.75, tableZ = -1.2, topY = 0.86;
    put(new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.05, 0.75), woodMat))
      .position.set(tableX, topY, tableZ);
    for (const [dx, dz] of [[-0.6, -0.32], [0.6, -0.32], [-0.6, 0.32], [0.6, 0.32]]) {
      put(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, topY, 10), woodMat))
        .position.set(tableX + dx, topY / 2, tableZ + dz);
    }
    const benchX = -2.6, benchZ = -0.9, seatY = 0.4;
    put(new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.08, 1.5), woodMat))
      .position.set(benchX, seatY, benchZ);
    put(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 1.5), woodMat))
      .position.set(benchX - 0.24, seatY + 0.27, benchZ);
    for (const dz of [-0.65, 0.65]) {
      put(new THREE.Mesh(new THREE.BoxGeometry(0.5, seatY, 0.08), woodMat))
        .position.set(benchX, seatY / 2, benchZ + dz);
    }
    // Внутренний светильник — живой свет комнаты, дышит погодой.
    this.lamp = new THREE.PointLight(0x9fd8ff, 0.8, 8);
    this.lamp.position.set(0, 2.5, -0.7);
    put(this.lamp);
    const quat = FLAT_QUAT.clone();
    const surfaces = [
      { x0: tableX - 0.63, x1: tableX + 0.63, z0: tableZ - 0.35, z1: tableZ + 0.35, y: topY + 0.025, quaternion: quat },
      { x0: benchX - 0.27, x1: benchX + 0.27, z0: benchZ - 0.73, z1: benchZ + 0.73, y: seatY + 0.04, quaternion: quat.clone() },
    ];
    return { group, parts: [group], surfaces };
  }

  buildDeck() {
    this.deckMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      blending: THREE.NormalBlending,
      uniforms: {
        uColor: { value: C.deckDay.clone() },
        uDrift: { value: new THREE.Vector2() },
        uCover: { value: 0.5 },
        uLum: { value: 1 },
      },
      vertexShader: DECK_VERT, fragmentShader: DECK_FRAG,
    });
    this.deckMesh = new THREE.Mesh(new THREE.PlaneGeometry(CFG.deckW, CFG.deckW), this.deckMat);
    this.deckMesh.rotation.x = Math.PI / 2;
    this.deckMesh.position.y = 2.3;
    this.add(this.deckMesh);
  }

  buildHaze() {
    this.hazeMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.BackSide,
      blending: THREE.NormalBlending,
      uniforms: { uColor: { value: C.hazeDay.clone() }, uFog: { value: 0 }, uLum: { value: 1 } },
      vertexShader: HAZE_VERT, fragmentShader: HAZE_FRAG,
    });
    this.hazeMesh = new THREE.Mesh(new THREE.SphereGeometry(5.2, 24, 16), this.hazeMat);
    this.hazeMesh.position.y = 1;
    this.hazeMesh.renderOrder = -5;
    this.add(this.hazeMesh);
  }

  // Объёмное облако — официальный аддон, как в сэмпле rain. В alpha-blend
  // passthrough не показывается (premultiplied-контракт), плита остаётся.
  buildCloudVolume() {
    const cloud = new VolumetricCloud();
    cloud.mesh.scale.set(4.6, 0.85, 4.6);
    cloud.mesh.renderOrder = -2;
    cloud.mesh.material.depthWrite = false;
    cloud.mesh.material.uniforms.steps.value = 28;
    cloud.visible = false;
    this.add(cloud);
    this.cloudVolume = cloud;
  }

  // --- звук: жест SOUND → буфер официального ассета, громкость от осадков ---

  toggleSound() {
    if (this.soundOn) {
      this.soundOn = false;
      this.ui.sound.label = 'SOUND OFF';
      return;
    }
    this.soundOn = true;
    this.ui.sound.label = this.soundReady ? 'SOUND ON' : 'SOUND …';
    this.ensureAudio();
    this.playRain();
  }

  ensureAudio() {
    if (this.listener) return;
    const camera = xb.core?.camera;
    if (!camera) {
      this.soundOn = false;
      this.soundFailed = true;
      this.ui.sound.label = 'SOUND OFF';
      return;
    }
    this.listener = new THREE.AudioListener();
    camera.add(this.listener);
    this.rainSound = new THREE.Audio(this.listener);
    new THREE.AudioLoader().load(
      CFG.soundUrl,
      (buffer) => {
        this.soundReady = true;
        this.rainSound.setBuffer(buffer);
        this.rainSound.setLoop(true);
        this.rainSound.setVolume(0);
        if (this.soundOn) {
          this.playRain();
          this.ui.sound.label = 'SOUND ON';
        }
      },
      undefined,
      () => {
        this.soundFailed = true;
        this.soundOn = false;
        this.ui.sound.label = 'SOUND OFF';
      }
    );
  }

  playRain() {
    if (!this.soundOn || !this.soundReady || !this.rainSound) return;
    const context = this.listener.context;
    if (context.state === 'suspended') void context.resume();
    if (!this.rainSound.isPlaying) this.rainSound.play();
  }

  // --- данные и погодная моторика ---------------------------------------------

  locate() {
    if (!navigator.geolocation) {
      this._defaulted = true;
      return this.load(this.lat, this.lon);
    }
    this.stat('LOCATING…');
    this._defaulted = false;
    navigator.geolocation.getCurrentPosition(
      (p) => {
        this.lat = +p.coords.latitude.toFixed(3);
        this.lon = +p.coords.longitude.toFixed(3);
        this.load(this.lat, this.lon);
      },
      () => {
        this._defaulted = true;
        this.load(this.lat, this.lon);
      },
      { timeout: 6000 }
    );
  }

  async load(lat, lon) {
    this.stat(`METEO ${lat.toFixed(2)}, ${lon.toFixed(2)} …`);
    try {
      this.data = await fetchWeather(lat, lon);
      // Источник данных виден в телеметрии всегда, а не один кадр.
      this.source = `LIVE · OPEN-METEO${this._defaulted ? ' · ТОЧКА ПО УМОЛЧАНИЮ' : ''} · ${lat.toFixed(2)}, ${lon.toFixed(2)}`;
    } catch (e) {
      this.data = demoData();
      this.source = `DEMO (нет сети: ${e.message}) · синтетика`;
    }
    this.applyHour();
  }

  nowIndex() {
    const t = this.data.hourly.time;
    const now = Date.now();
    let best = 0, bd = Infinity;
    for (let i = 0; i < t.length; i++) {
      const d = Math.abs(Date.parse(t[i]) - now);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  applyHour() {
    if (!this.data?.hourly) return;
    const h = this.data.hourly;
    // Дробная перемотка: слайдер с шагом 0.25 ч, поля интерполируются между
    // часами — скраб видно каждым движением, а не «щёлками» раз в час.
    const idx = clamp(this.nowIndex() + this.offset, 0, h.time.length - 1);
    const i0 = Math.floor(idx);
    const i1 = Math.min(h.time.length - 1, i0 + 1);
    const fr = idx - i0;
    const g = (key, d = 0) => {
      const a = num(h[key] && h[key][i0], d);
      const b = num(h[key] && h[key][i1], d);
      return a + (b - a) * fr;
    };
    const speed = num(h.wind_speed_10m && h.wind_speed_10m[i0], 4);
    const speed1 = num(h.wind_speed_10m && h.wind_speed_10m[i1], speed);
    const rain = g('rain');
    const showers = g('showers');
    this.state = {
      temp: g('temperature_2m', 8),
      rh: g('relative_humidity_2m', 65),
      cloud: g('cloud_cover', 50),
      wind: g('wind_speed_10m', 4),
      gust: g('wind_gusts_10m', (speed + (speed1 - speed) * fr) * 1.6),
      wdir: g('wind_direction_10m', 225),
      press: g('pressure_msl', 1010),
      vis: g('visibility', 15000),
      rain, showers, snow: g('snowfall'),
      code: Math.round(g('weather_code', 2)),
      isDay: g('is_day', 1) > 0.5 ? 1 : 0,
      precip: g('precipitation', rain + showers),
    };
    this.derive();
    this.applyLook();
    const when = new Date(Date.parse(h.time[i0]) + fr * 3600e3);
    const off = this.offset;
    this.ui.sliderLabel.text =
      `${Math.abs(off) < 0.13 ? 'NOW · ' : ''}${when.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} ` +
      `· ${off >= 0 ? '+' : '−'}${Math.abs(off).toFixed(off % 1 ? 2 : 0).replace(/\.0+$/, '')}h`;
    this.ui.icon.icon = iconFor(this.state);
  }

  // Поля ответа → параметры сцены.
  derive() {
    const s = this.state;
    this.deckY = clamp(1.75 + ((s.press - 990) / 40) * 1.5, 1.5, 3.3);
    let fog = Math.pow(1 - Math.min(s.vis, 12000) / 12000, 2.2);
    if (s.code === 45 || s.code === 48) fog = Math.max(fog, 0.72);
    this.fogK = clamp(fog, 0, 1);
    this.dayK = s.isDay ? 1 : 0.34;
    const cloud01 = clamp(s.cloud / 100, 0, 1);
    this.lumK = clamp(this.dayK * (1 - cloud01 * 0.5) * (1 - this.fogK * 0.45), 0.45, 1);
    this.rainK = clamp(s.rain / 0.6, 0, 1);
    this.showerK = clamp(s.showers / 3, 0, 1);
    this.snowK = clamp(s.snow / 1.2, 0, 1);
    this.starK = (1 - s.isDay) * Math.pow(1 - cloud01, 1.5) * (1 - this.fogK);
  }

  applyLook() {
    this.cloudT = clamp(this.state.cloud / 100, 0, 1);
    this.deckColorT.copy(this.state.isDay ? C.deckDay : C.deckNight);
    this.hazeColorT.copy(this.state.isDay ? C.hazeDay : C.hazeNight);
    this.cloudTint.copy(this.state.isDay ? C.cloudDay : C.cloudNight);
    const tier = [0.3, 0.6, 1][this._q ?? 2];
    this.applyDropCount();
    // Снег: активные точки пересчитываются прямо в буфере.
    if (this.snow) {
      const n = Math.round(this.snowK * this.snow.count * tier);
      const p = this.snow.pos;
      for (let i = this.snow.active; i < n; i++) {
        const ix = i * 3;
        p[ix] = (Math.random() * 2 - 1) * CFG.atm.x;
        p[ix + 1] = Math.random() * CFG.atm.top;
        p[ix + 2] = (Math.random() * 2 - 1) * CFG.atm.z;
      }
      for (let i = n; i < this.snow.active; i++) p[i * 3 + 1] = -60;
      this.snow.active = n;
      this.snow.posAttr.needsUpdate = true;
    }
    // Аэрозоль влажности: гуще при высокой rh, цвет от температуры.
    if (this.moteL) {
      const rh01 = clamp((this.state.rh - 25) / 74, 0, 1);
      const n = Math.round((0.15 + 0.85 * rh01) * (1 - 0.4 * this.fogK) * this.moteL.count * tier);
      const p = this.moteL.pos;
      for (let i = this.moteL.active; i < n; i++) {
        const ix = i * 3;
        p[ix] = (Math.random() * 2 - 1) * CFG.atm.x;
        p[ix + 1] = 0.05 + Math.random() * (CFG.atm.top - 0.05);
        p[ix + 2] = (Math.random() * 2 - 1) * CFG.atm.z;
      }
      for (let i = n; i < this.moteL.active; i++) p[i * 3 + 1] = -60;
      this.moteL.active = n;
      this.moteL.posAttr.needsUpdate = true;
      this.moteL.baseT.set(0x9fc4ff).lerp(new THREE.Color(0xffd2a0),
        clamp((this.state.temp + 15) / 45, 0, 1));
    }
  }

  applyDropCount() {
    if (!this.drops) return;
    const tier = [0.55, 0.8, 1][this._q ?? 2];
    const wet = clamp(this.rainK * 0.6 + this.showerK * 0.75, 0, 1);
    const n = Math.round(wet * this.drops.count * tier);
    for (let i = this.drops.active; i < n; i++) this.respawnDrop(i, false);
    for (let i = n; i < this.drops.active; i++) {
      this.drops.pos[i * 3 + 1] = -60;
      this.drops.weights[i] = 0;
      this.drops.visibility[i] = 0;
    }
    this.drops.active = n;
    this.drops.mesh.count = n;
    this.drops.weightAttr.needsUpdate = true;
    this.drops.visAttr.needsUpdate = true;
  }

  // --- дождь: шаг системы (механика сэмпла + погодная моторика) ---------------

  depthLive() {
    const depth = xb.core?.depth;
    const mesh = depth?.depthMesh;
    if (!depth || !mesh || depth.depthArray?.[0] === undefined) return false;
    const min = mesh.minDepth;
    return typeof min === 'number' && min > 0.1 && min < 8;
  }

  respawnDrop(i, randomY = true) {
    const D = this.drops;
    const ix = i * 3;
    D.weights[i] = 0;
    D.visibility[i] = 1;
    // 10% капель рождается прямо на реальной геометрии лучом из камеры —
    // дождь идёт сквозь настоящий объём комнаты (как в сэмпле).
    if (this.depthLive() && Math.random() < 0.1) {
      this._ndc.set(Math.random() * 1.6 - 0.8, Math.random() * 1.6 - 0.8, 0.5).unproject(xb.core.camera);
      this._ray.set(xb.core.camera.position, this._ndc.sub(xb.core.camera.position).normalize());
      const hits = this._ray.intersectObject(xb.core.depth.depthMesh);
      if (hits.length) {
        D.pos[ix] = hits[0].point.x;
        D.pos[ix + 1] = clamp(hits[0].point.y + 0.02, 0.02, CFG.atm.top);
        D.pos[ix + 2] = hits[0].point.z;
        return;
      }
    }
    D.pos[ix] = (Math.random() * 2 - 1) * CFG.atm.x;
    D.pos[ix + 1] = randomY
      ? 0.2 + Math.random() * (this.deckY - 0.2)
      : this.deckY;
    D.pos[ix + 2] = (Math.random() * 2 - 1) * CFG.atm.z;
  }

  stepDrops(dt, camera) {
    const D = this.drops;
    if (!D || !D.active) return;
    const s = this.state;
    const depth = this.depthLive() ? xb.core.depth : null;
    const depthMesh = depth?.depthMesh;
    const fallBase = 2.6 + 1.8 * this.rainK + 2.2 * this.showerK;
    D.fall += (fallBase - D.fall) * Math.min(1, dt * 2);
    const a = ((s.wdir + 180) % 360) * Math.PI / 180;
    const wx = Math.sin(a) * s.wind * 0.06;
    const wz = -Math.cos(a) * s.wind * 0.06;
    const dropScale = 0.075 * (1 + 0.3 * this.showerK);
    const camWorld = camera.matrixWorldInverse;
    const dummy = this._dummy;
    for (let i = 0; i < D.active; i++) {
      const ix = i * 3;
      let x = D.pos[ix], y = D.pos[ix + 1], z = D.pos[ix + 2];
      if (D.weights[i] < 0.5) {
        x += wx * dt;
        z += wz * dt;
        y -= D.fall * D.dropMul[i] * dt;
      }
      // Depth-окклюзия (как в сэмпле): капля за реальной геометрией гаснет,
      // встретив её на своём луче — начинает всплеск в точке встречи.
      let visibility = 1;
      if (depth) {
        this._ndc.set(x, y, z).project(camera);
        const inFov = this._ndc.z > 0 && this._ndc.z < 1 &&
          Math.abs(this._ndc.x) < 0.9 && Math.abs(this._ndc.y) < 0.9;
        if (inFov) {
          const d = depth.getDepth((this._ndc.x + 1) / 2, (this._ndc.y + 1) / 2);
          this._camPos.set(x, y, z).applyMatrix4(camWorld);
          const dist = -this._camPos.z;
          const occluded = d === 0 || d < dist;
          if (occluded) {
            visibility = clamp(0.6 - Math.abs(dist - d), 0, 0.6);
            if (D.weights[i] === 0 && y <= 2.0) D.weights[i] = 1;
          }
        } else {
          visibility = 0;
        }
      }
      // Поверхность: детектируемая плоскость (стол/пол комнаты) или пол y=0.
      const surf = this.surfaceAt(x, z);
      const groundY = surf ? surf.y : 0;
      if (y <= groundY) {
        y = groundY;
        if (D.weights[i] < 0.5) {
          D.weights[i] = 1;
          this.wetSpot(x, y, z, surf ? surf.quaternion : FLAT_QUAT, false);
        }
      }
      if (D.weights[i] > 0) D.weights[i] += dt * 60;
      if (D.weights[i] > CFG.splashFrames * CFG.splashSpeed) {
        this.respawnDrop(i, false);
        x = D.pos[ix]; y = D.pos[ix + 1]; z = D.pos[ix + 2];
        visibility = 1;
      }
      D.pos[ix] = x; D.pos[ix + 1] = y; D.pos[ix + 2] = z;
      D.visibility[i] = visibility;
      dummy.position.set(x, y, z);
      const w = D.weights[i];
      const size = dropScale * D.dropSize[i] * (w > 0 ? 1.6 : 1);
      dummy.scale.set(size, size, 1);
      dummy.updateMatrix();
      D.mesh.setMatrixAt(i, dummy.matrix);
    }
    D.mesh.instanceMatrix.needsUpdate = true;
    D.weightAttr.needsUpdate = true;
    D.visAttr.needsUpdate = true;
    D.mat.uniforms.uCameraPosition.value.copy(camera.position);
    // Наклон росчерка — по текущему ветру (заметнее, чем физический снос).
    D.mat.uniforms.uLeanWorld.value.set(wx * 0.11, 0, wz * 0.11);
  }

  // Горизонтальные плоскости комнаты (plane detection): стол, пол, столешница.
  // Тонкие боксы с малой толщиной по Y — вертикальные стены дождь не ловят.
  sampleSurfaces() {
    const next = [];
    let planes = [];
    try { planes = xb.world.planes.get(); } catch { /* детектор выключен */ }
    const box = new THREE.Box3();
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    const q = new THREE.Quaternion();
    for (const plane of planes) {
      plane.updateWorldMatrix(true, false);
      box.setFromObject(plane);
      box.getSize(size);
      if (size.y > Math.max(0.05, Math.min(size.x, size.z) * 0.35)) continue;
      if (box.max.y <= 0.02 || box.max.y > CFG.atm.top) continue;
      box.getCenter(center);
      plane.getWorldQuaternion(q);
      const n = new THREE.Vector3(0, 1, 0).applyQuaternion(q).normalize();
      if (n.y < 0) n.negate();
      next.push({
        x0: box.min.x, x1: box.max.x, z0: box.min.z, z1: box.max.z,
        y: center.y,
        quaternion: new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n),
      });
    }
    this.surfaces = next;
  }

  surfaceAt(x, z) {
    // Поверхности виртуальной комнаты первичны — но только там, где комната
    // видна (VR/flat). В AR-passthrough комната скрыта: капли садятся на
    // реальные плоскости и depth, а не на невидимый стол.
    if (!isPassthrough()) {
      for (const s of this.room.surfaces) {
        if (x < s.x0 || x > s.x1 || z < s.z0 || z > s.z1) continue;
        return s;
      }
    }
    for (const s of this.surfaces) {
      if (x < s.x0 || x > s.x1 || z < s.z0 || z > s.z1) continue;
      return s;
    }
    return null;
  }

  // Мокрые пятна: пул плоских квадов с процедурной текстурой, NormalBlending —
  // это след, а не свет. Жизнь 5…13 с, рецикл старейшего слота.
  ensureStains() {
    if (this.stains) return;
    const cv = document.createElement('canvas');
    cv.width = cv.height = 128;
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 60);
    g.addColorStop(0, 'rgba(255,255,255,0.9)');
    g.addColorStop(0.55, 'rgba(255,255,255,0.35)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    const geo = new THREE.PlaneGeometry(1, 1);
    const pool = [];
    for (let i = 0; i < 26; i++) {
      const mat = new THREE.MeshBasicMaterial({
        map: tex, color: 0xbfe3ff, transparent: true, opacity: 0,
        depthWrite: false, blending: THREE.NormalBlending,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.visible = false;
      this.add(mesh);
      pool.push({ mesh, life: 1e9, dur: 1, peak: 0.4 });
    }
    this.stains = { tex, geo, pool };
  }

  wetSpot(x, y, z, quaternion, isSnow) {
    if (this._stainCd > 0 || (this._q ?? 2) === 0) return;
    this.ensureStains();
    const rate = this.rainK * 0.5 + this.showerK * 0.75 + this.snowK * 0.35;
    this._stainCd = 0.42 - 0.3 * clamp(rate, 0, 1);
    const s = this.stains.pool.find((p) => p.life >= p.dur) || this.stains.pool[0];
    s.life = 0;
    s.dur = isSnow ? 9 + Math.random() * 4 : 5 + Math.random() * 4;
    s.peak = isSnow ? 0.3 : 0.42;
    s.mesh.position.set(x, y + 0.004, z);
    s.mesh.quaternion.copy(quaternion);
    s.mesh.scale.setScalar(isSnow ? 0.05 + Math.random() * 0.03 : 0.09 + Math.random() * 0.07);
    s.mesh.material.color.set(isSnow ? 0xeef6ff : 0xbfe3ff);
    s.mesh.visible = true;
  }

  stepStains(dt) {
    if (!this.stains) return;
    for (const s of this.stains.pool) {
      if (s.life >= s.dur) {
        if (s.mesh.visible) s.mesh.visible = false;
        continue;
      }
      s.life += dt;
      const f = Math.min(1, s.life / s.dur);
      s.mesh.material.opacity = s.peak * (1 - f) * (1 - f);
    }
  }

  // Накопление снега: точки на полу в месте посадки, живут ~минуту.
  ensureFlakes() {
    if (this.flakes) return;
    const N = 400;
    const pos = new Float32Array(N * 3).fill(-60);
    const geo = new THREE.BufferGeometry();
    const pa = new THREE.BufferAttribute(pos, 3);
    pa.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('position', pa);
    const mat = glowBlending(new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: {
        map: { value: glowSprite() },
        uSize: { value: 0.014 },
        uColor: { value: new THREE.Color(0xeef6ff) },
        uOpacity: { value: 0.8 },
      },
      vertexShader: /* glsl */`
        varying float vFog;
        uniform float uSize;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float dist = max(0.1, -mv.z);
          gl_PointSize = uSize * 900.0 / dist;
          vFog = exp(-dist * 0.12);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        varying float vFog;
        uniform sampler2D map;
        uniform vec3 uColor;
        uniform float uOpacity;
        void main() {
          float a = texture2D(map, gl_PointCoord).a;
          gl_FragColor = vec4(uColor * vFog, a * uOpacity);
        }`,
    }));
    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    this.add(points);
    this.flakes = { pos, pa, geo, mat, points, head: 0, N, life: new Float32Array(N) };
  }

  snowDot(x, z) {
    if (this.snowK < 0.05 || (this._q ?? 2) === 0) return;
    this.ensureFlakes();
    const F = this.flakes;
    F.head = (F.head + 1) % F.N;
    const i = F.head;
    F.pos[i * 3] = x;
    F.pos[i * 3 + 1] = 0.006;
    F.pos[i * 3 + 2] = z;
    F.life[i] = 40 + Math.random() * 20;
    F.pa.needsUpdate = true;
  }

  stepFlakes(dt) {
    if (!this.flakes) return;
    const F = this.flakes;
    let any = false;
    for (let i = 0; i < F.N; i++) {
      if (F.life[i] <= 0) continue;
      F.life[i] -= dt;
      if (F.life[i] <= 0) {
        F.pos[i * 3 + 1] = -60;
        any = true;
      }
    }
    if (any) F.pa.needsUpdate = true;
  }

  // Аэрозоль влажности: мелкие пылинки, плотность от rh, цвет от температуры,
  // дрожь от порывов — ещё одно поле ответа с видимой причиной.
  buildMotes() {
    const count = CFG.motes;
    const pos = new Float32Array(count * 3).fill(-60);
    const geo = new THREE.BufferGeometry();
    const pa = new THREE.BufferAttribute(pos, 3);
    pa.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('position', pa);
    const mat = glowBlending(new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: {
        map: { value: glowSprite() },
        uSize: { value: 0.011 },
        uColor: { value: new THREE.Color(0x9fc4ff) },
        uOpacity: { value: 0.12 },
      },
      vertexShader: /* glsl */`
        varying float vFog;
        uniform float uSize;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float dist = max(0.1, -mv.z);
          gl_PointSize = uSize * 900.0 / dist;
          vFog = exp(-dist * 0.12);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        varying float vFog;
        uniform sampler2D map;
        uniform vec3 uColor;
        uniform float uOpacity;
        void main() {
          float a = texture2D(map, gl_PointCoord).a;
          gl_FragColor = vec4(uColor * vFog, a * uOpacity);
        }`,
    }));
    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    this.add(points);
    return {
      count, pos, geo, mat, points, active: 0, posAttr: pa,
      phase: new Float32Array(count).map(() => Math.random() * Math.PI * 2),
      baseT: new THREE.Color(0x9fc4ff),
    };
  }

  stepMotes(dt) {
    const M = this.moteL;
    if (!M || !M.active) return;
    const st = this.state;
    const a = ((st.wdir + 180) % 360) * Math.PI / 180;
    const wx = Math.sin(a) * st.wind * 0.35;
    const wz = -Math.cos(a) * st.wind * 0.35;
    const gust = clamp(st.gust / 14, 0, 1);
    const t = performance.now() * 0.001;
    const p = M.pos, ph = M.phase;
    for (let i = 0; i < M.active; i++) {
      const ix = i * 3, an = ph[i];
      let x = p[ix] + (wx + Math.sin(t * 0.9 + an) * 0.4 * gust) * dt;
      let y = p[ix + 1] + (Math.sin(t * 0.7 + an * 2.3) * 0.2 + 0.04) * dt;
      let z = p[ix + 2] + (wz + Math.cos(t * 0.8 + an * 1.3) * 0.4 * gust) * dt;
      if (x > CFG.atm.x) x -= CFG.atm.x * 2; else if (x < -CFG.atm.x) x += CFG.atm.x * 2;
      if (z > CFG.atm.z) z -= CFG.atm.z * 2; else if (z < -CFG.atm.z) z += CFG.atm.z * 2;
      if (y > CFG.atm.top) y = 0.05; else if (y < 0.05) y = CFG.atm.top;
      p[ix] = x; p[ix + 1] = y; p[ix + 2] = z;
    }
    M.posAttr.needsUpdate = true;
    const rh01 = clamp((st.rh - 25) / 74, 0, 1);
    M.mat.uniforms.uOpacity.value = (0.05 + 0.16 * rh01) * (1 - 0.4 * this.fogK) * (0.5 + 0.6 * this.lumK);
    M.mat.uniforms.uColor.value.lerp(M.baseT, Math.min(1, dt * 2));
  }

  stepSnow(dt) {
    const S = this.snow;
    if (!S || !S.active) return;
    const st = this.state;
    const a = ((st.wdir + 180) % 360) * Math.PI / 180;
    const wx = Math.sin(a) * st.wind * 0.4;
    const wz = -Math.cos(a) * st.wind * 0.4;
    const t = performance.now() * 0.001;
    const fall = 0.35 + 0.25 * this.snowK;
    const p = S.pos, ph = S.phase;
    for (let i = 0; i < S.active; i++) {
      const ix = i * 3, an = ph[i];
      let x = p[ix] + (wx + Math.sin(t * 1.3 + an) * 0.22) * dt;
      let z = p[ix + 2] + (wz + Math.cos(t * 1.1 + an * 1.7) * 0.22) * dt;
      let y = p[ix + 1] - (fall + Math.sin(t * 2.1 + an * 2.3) * 0.06) * dt;
      const surf = this.surfaceAt(x, z);
      const gy = surf ? surf.y : 0;
      if (y <= gy) {
        this.snowDot(x, z);
        x = (Math.random() * 2 - 1) * CFG.atm.x;
        y = CFG.atm.top;
        z = (Math.random() * 2 - 1) * CFG.atm.z;
      }
      if (x > CFG.atm.x) x -= CFG.atm.x * 2; else if (x < -CFG.atm.x) x += CFG.atm.x * 2;
      if (z > CFG.atm.z) z -= CFG.atm.z * 2; else if (z < -CFG.atm.z) z += CFG.atm.z * 2;
      p[ix] = x; p[ix + 1] = y; p[ix + 2] = z;
    }
    S.posAttr.needsUpdate = true;
  }

  condition() {
    const s = this.state;
    if (s.snow > 0.05 && s.code < 70) return 'SNOW';
    if (s.rain + s.showers > 0.05 && s.code < 50) return 'RAIN';
    return conditionName(s.code);
  }

  update() {
    const dt = Math.min(xb.getDeltaTime(), 0.05);
    const s = this.state;
    const camera = xb.getXrCameraLeft?.() || xb.core.camera;

    // Гроза: редкие вспышки поверх всего.
    if (s.code >= 95) {
      this.flashT -= dt;
      if (this.flashT <= 0) { this.flash = 1; this.flashT = 3.5 + Math.random() * 6; }
    }
    this.flash = Math.max(0, this.flash - dt * 3.2);

    // Авто-качество: стабильно дорогой кадр — гасим самые тяжёлые слои
    // (объёмное облако, часть частиц, пятна), дешёвый — возвращаем.
    this._ft = this._ft === undefined ? dt : this._ft * 0.95 + dt * 0.05;
    this._qAge = (this._qAge || 0) + dt;
    if (this._qAge > 2.5) {
      this._qAge = 0;
      this._q = this._q ?? 2;
      if (this._ft > 0.05 && this._q > 0) { this._q--; this.applyLook(); }
      else if (this._ft < 0.028 && this._q < 2) { this._q++; this.applyLook(); }
    }

    if ((this._surfaceAge += dt) > 1) { this._surfaceAge = 0; this.sampleSurfaces(); }
    this.stepDrops(dt, camera);
    this.stepSnow(dt);
    this.stepMotes(dt);
    this.stepFlakes(dt);
    this.stepStains(dt);
    this._stainCd = Math.max(0, this._stainCd - dt);
    this._depthOn = this.depthLive();

    const k = Math.min(1, dt * 2.2);
    const lit = this.lumK * (1 + this.flash * 0.9) * this._arGain;
    // Свет дышит погодой: день/облака/мгла и вспышки молний. Никогда не
    // в полной темноте — пол лампы комнаты держит нижний уровень.
    this.hemi.intensity = 1.2 + 1.4 * lit;
    this.sun.intensity = 0.5 + 1.1 * lit + this.flash * 2.2;
    if (this.lamp) this.lamp.intensity = 0.5 + 0.9 * lit;
    if (this.glassMat) {
      this.glassMat.color.copy(this.deckColorT).lerp(this.cloudTint, this.cloud)
        .multiplyScalar(1.5 + 0.9 * lit);
    }

    // Слои: плавная подстройка к целям текущего часа.
    if (this.drops) {
      const u = this.drops.mat.uniforms;
      u.uLit.value += ((0.55 + 0.75 * lit) - u.uLit.value) * k;
      u.uOpacity.value += ((0.55 + 0.4 * (this.rainK * 0.6 + this.showerK)) - u.uOpacity.value) * k;
    }
    if (this.snow) {
      this.snow.mat.uniforms.uOpacity.value +=
        ((this.snowK > 0.02 ? 0.6 + 0.3 * this.snowK : 0) * (0.5 + 0.6 * lit)
          - this.snow.mat.uniforms.uOpacity.value) * k;
    }
    this.stars.mat.uniforms.uOpacity.value += (this.starK - this.stars.mat.uniforms.uOpacity.value) * k;

    // Облачная плита: плотность, высота, дрейф по ветру.
    this.cloud += (this.cloudT - this.cloud) * k;
    this.deckMat.uniforms.uCover.value = this.cloud;
    this.deckMat.uniforms.uColor.value.lerp(this.deckColorT, k);
    this.deckMat.uniforms.uLum.value = lit * (1 - 0.7 * this.fogK);
    this.deckMesh.position.y = this.deckY;
    const a = ((s.wdir + 180) % 360) * Math.PI / 180;
    this.drift.x = (this.drift.x + Math.sin(a) * s.wind * dt * 0.012) % 6;
    this.drift.y = (this.drift.y - Math.cos(a) * s.wind * dt * 0.012) % 6;
    this.deckMat.uniforms.uDrift.value.copy(this.drift);

    // Мгла — вдвое мягче: пелена атмосферы, а не занавес.
    this.hazeMat.uniforms.uFog.value += (this.fogK * 0.55 - this.hazeMat.uniforms.uFog.value) * k;
    this.hazeMat.uniforms.uColor.value.lerp(this.hazeColorT, k);
    this.hazeMat.uniforms.uLum.value = 0.35 + 0.65 * this.dayK + this.flash * 0.3;

    // Объёмное облако: официальный аддон; в passthrough и на низком
    // качестве не ставится (premultiplied-контракт + цена рей-марчинга).
    if (this.cloudVolume) {
      const v = this.cloudVolume;
      v.visible = !isPassthrough() && (this._q ?? 2) === 2 && this.cloud > 0.15;
      if (v.visible) {
        v.position.y = this.deckY;
        v.update(camera, xb.core.depth);
        const u = v.mesh.material.uniforms;
        this._cloudTint.copy(this.cloudTint).multiplyScalar(0.45 + 0.75 * this.lumK);
        u.base.value.lerp(this._cloudTint, k);
        u.threshold.value = 0.32 - 0.18 * this.cloud;
        u.opacity.value = (0.16 + 0.44 * this.cloud) * (1 - 0.45 * this.fogK) * (1 + this.flash * 0.4);
      }
    }

    // Громкость дождя — от интенсивности осадков текущего часа.
    if (this.soundOn && this.rainSound && this.soundReady) {
      const wet = clamp(this.rainK * 0.6 + this.showerK * 0.75 + this.snowK * 0.35, 0, 1);
      this.rainSound.setVolume(wet < 0.02 ? 0 : 0.12 + 0.5 * wet);
    }

    // Телеметрия: три фиксированные строки, обновление дважды в секунду.
    this._fp += dt;
    if (this._fp > 0.5) {
      this._fp = 0;
      const vis = s.vis >= 1000 ? `${(s.vis / 1000).toFixed(1)} км` : `${Math.round(s.vis)} м`;
      const sound = this.soundOn ? (this.soundReady ? 'вкл' : '…') : this.soundFailed ? 'нет' : 'выкл';
      this.ui.src.text = this.source;
      this.ui.stat.text = `${this.condition()} · ${s.temp.toFixed(1)}°C · ветер ${s.wind.toFixed(1)} м/с ${dirName(s.wdir)}`;
      this.ui.detail.text =
        `дождь ${(s.rain + s.showers).toFixed(2)} · снег ${s.snow.toFixed(2)} см/ч · облака ${Math.round(s.cloud)}% · видимость ${vis} · ${Math.round(s.press)} гПа · потолок ${this.deckY.toFixed(1)} м\n` +
        `поверхности ${this.room.surfaces.length + this.surfaces.length} · капли ${this.drops?.active ?? 0} · depth ${this._depthOn ? 'есть' : 'нет'} · звук ${sound}${
          (this._q ?? 2) < 2 ? ` · качество ${this._q}/2` : ''}`;
    }
  }

  dispose() {
    if (this.room) {
      this.room.group.traverse((o) => {
        o.geometry?.dispose();
        if (o.material) {
          (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
        }
      });
      this.remove(this.room.group);
      this.room = null;
    }
    if (this.drops) {
      this.drops.geo.dispose();
      this.drops.mat.dispose();
      this.remove(this.drops.mesh);
      this.drops = null;
    }
    for (const S of [this.snow, this.stars, this.moteL]) {
      if (!S) continue;
      S.geo.dispose();
      S.mat.dispose();
      this.remove(S.points);
    }
    if (this.stains) {
      for (const s of this.stains.pool) {
        s.mesh.material.dispose();
        this.remove(s.mesh);
      }
      this.stains.geo.dispose();
      this.stains.tex.dispose();
      this.stains = null;
    }
    if (this.flakes) {
      this.flakes.geo.dispose();
      this.flakes.mat.dispose();
      this.remove(this.flakes.points);
      this.flakes = null;
    }
    this.deckMesh.geometry.dispose();
    this.deckMat.dispose();
    this.hazeMesh.geometry.dispose();
    this.hazeMat.dispose();
    this.floor.geometry.dispose();
    this.floor.material.dispose();
    if (this.cloudVolume) {
      const { material, geometry } = this.cloudVolume.mesh;
      material.uniforms.map.value?.dispose();
      material.dispose();
      geometry.dispose();
      this.remove(this.cloudVolume);
      this.cloudVolume = null;
    }
    if (this.rainSound) {
      if (this.rainSound.isPlaying) this.rainSound.stop();
      this.rainSound.disconnect();
      this.rainSound = null;
    }
    if (this.listener) {
      xb.core?.camera?.remove(this.listener);
      this.listener = null;
    }
  }
}

const options = new xb.Options();
options.enableReticles();
options.enablePlaneDetection();
// Depth — источник реальных поверхностей: капли гаснут за геометрией и
// всплескиваются на ней. Где сенсора нет (телефон), installXrGuards повторяет
// requestSession без depth-sensing — дождь остаётся на полу y=0.
options.enableDepth();
options.world?.enableAnchors?.();
options.world.planes.showDebugVisualizations = DEBUG;
options.xrButton.showEnterSimulatorButton = true;
options.setAppTitle('WEATHER//ROOM');
options.setAppDescription('Погода снаружи — тело комнаты. Каждое поле метео видно глазом.');

installXrGuards();
if (AUTOMATION) document.body.classList.add('automation');

document.addEventListener('DOMContentLoaded', () => {
  xb.add(new WeatherRoom());
  xb.init(options);
  watchXrButton([
    'Вход — кнопка по центру: погода встанет вокруг тебя',
    'Слайдер — время −24…+24 ч, LOCATE — погода в твоей точке',
    'SOUND — звук дождя по интенсивности часа, включается жестом',
    'Капли всплескиваются на реальных поверхностях (depth) и на полу',
  ]);
});
</script>
</body>
</html>
